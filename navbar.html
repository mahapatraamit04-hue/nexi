<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adaptive Navbar</title>

<style>

  /* =========================================================
     ROOT
  ========================================================= */

  :root {
    --nav-h: 72px;
    --maxw: 1500px;

    --navy: #0d0c1d;
    --ink: #0d0c1d;
    --paper: #ffffff;

    --mobile-breakpoint: 767px;
  }


  /* =========================================================
     RESET
  ========================================================= */

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }


  html {
    scroll-behavior: smooth;
  }


  body {
    font-family:
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      Roboto,
      Helvetica,
      Arial,
      sans-serif;
  }


  /* =========================================================
     NAVBAR
  ========================================================= */

  .nav {
    position: fixed;
    top: 0;
    left: 0;

    width: 100%;
    height: var(--nav-h);

    z-index: 1000;

    display: flex;
    align-items: center;

    /*
      Transparent glass.
      No white/dark tint.
    */
    background: transparent;

    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
  }


  /* =========================================================
     NAV INNER
  ========================================================= */

  .nav__inner {
    width: 100%;
    max-width: var(--maxw);

    margin: 0 auto;
    padding: 0 32px;

    display: flex;
    align-items: center;
    justify-content: space-between;
  }


  /* =========================================================
     LOGO
  ========================================================= */

  .nav__logo {
    position: relative;

    display: block;

    height: 28px;
    line-height: 0;

    flex-shrink: 0;
  }


  .nav__logo img {
    height: 28px;
    width: auto;

    display: block;

    position: absolute;
    top: 0;
    left: 0;

    /*
      IMPORTANT:
      No transition.
      Logo changes immediately.
    */
    transition: none;
  }


  .nav__logo img[data-for="light"] {
    position: relative;
    opacity: 1;
  }


  .nav__logo img[data-for="dark"] {
    opacity: 0;
  }


  /* =========================================================
     DESKTOP CENTER NAV
  ========================================================= */

  .nav__links {
    display: flex;
    align-items: center;

    gap: 36px;

    list-style: none;

    position: absolute;
    left: 50%;
    transform: translateX(-50%);
  }


  .nav__links a {
    font-family: "Switzer", sans-serif;

    font-size: 15px;
    font-weight: 500;
    line-height: 1.2;
    letter-spacing: 0;

    text-decoration: none;

    color: var(--ink);
    opacity: .85;

    /*
      Only hover opacity animates.
      Theme color changes immediately.
    */
    transition: opacity .2s ease;
  }


  .nav__links a:hover {
    opacity: 1;
  }


  /* =========================================================
     MOBILE MENU BUTTON
  ========================================================= */

  .nav__menu-button {
    display: none;

    width: 40px;
    height: 40px;

    padding: 0;

    border: 0;
    background: transparent;

    cursor: pointer;

    align-items: center;
    justify-content: center;

    flex-shrink: 0;
  }


  .nav__menu-icon {
    position: relative;

    width: 22px;
    height: 16px;
  }


  .nav__menu-icon span {
    position: absolute;

    left: 0;

    width: 22px;
    height: 1.5px;

    background: var(--ink);

    transition:
      transform .2s ease,
      opacity .2s ease,
      background 0s;
  }


  .nav__menu-icon span:nth-child(1) {
    top: 2px;
  }


  .nav__menu-icon span:nth-child(2) {
    top: 8px;
  }


  .nav__menu-icon span:nth-child(3) {
    top: 14px;
  }


  /* =========================================================
     MOBILE MENU
  ========================================================= */

  .nav__mobile-menu {
    display: none;

    position: fixed;

    top: var(--nav-h);
    left: 0;

    width: 100%;

    padding: 24px 32px 32px;

    background: transparent;

    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);

    opacity: 0;
    visibility: hidden;
    pointer-events: none;

    transform: translateY(-8px);

    transition:
      opacity .2s ease,
      transform .2s ease,
      visibility .2s ease;
  }


  .nav__mobile-links {
    display: flex;
    flex-direction: column;

    gap: 22px;

    list-style: none;
  }


  .nav__mobile-links a {
    font-family: "Switzer", sans-serif;

    font-size: 18px;
    font-weight: 500;
    line-height: 1.2;

    text-decoration: none;

    color: var(--ink);
  }


  /* =========================================================
     MOBILE MENU OPEN
  ========================================================= */

  .nav.menu-open .nav__mobile-menu {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;

    transform: translateY(0);
  }


  /*
    Hamburger → X
  */

  .nav.menu-open .nav__menu-icon span:nth-child(1) {
    transform: translateY(6px) rotate(45deg);
  }


  .nav.menu-open .nav__menu-icon span:nth-child(2) {
    opacity: 0;
  }


  .nav.menu-open .nav__menu-icon span:nth-child(3) {
    transform: translateY(-6px) rotate(-45deg);
  }


  /* =========================================================
     DARK THEME
  ========================================================= */

  .nav[data-theme="dark"] {
    background: transparent;
  }


  .nav[data-theme="dark"] .nav__links a {
    color: var(--paper);
  }


  .nav[data-theme="dark"] .nav__logo img[data-for="light"] {
    opacity: 0;
  }


  .nav[data-theme="dark"] .nav__logo img[data-for="dark"] {
    opacity: 1;
  }


  .nav[data-theme="dark"] .nav__menu-icon span {
    background: var(--paper);
  }


  .nav[data-theme="dark"] .nav__mobile-links a {
    color: var(--paper);
  }


  /* =========================================================
     MOBILE
  ========================================================= */

  @media (max-width: 767px) {

    .nav {
      height: 64px;
    }


    .nav__inner {
      padding: 0 20px;
    }


    .nav__logo {
      height: 26px;
    }


    .nav__logo img {
      height: 26px;
    }


    /*
      Hide desktop navigation.
    */

    .nav__links {
      display: none;
    }


    /*
      Show hamburger.
    */

    .nav__menu-button {
      display: flex;
    }


    /*
      Mobile menu starts below
      the 64px mobile navbar.
    */

    .nav__mobile-menu {
      display: block;

      top: 64px;

      padding:
        24px
        20px
        32px;
    }


    .nav__mobile-links {
      gap: 24px;
    }


    .nav__mobile-links a {
      font-size: 18px;
      font-weight: 500;
    }

  }


  /* =========================================================
     DEMO SECTIONS
     Remove these when moving to Webflow
  ========================================================= */

  main section {
    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 120px 32px;

    text-align: center;
  }


  section[data-nav-theme="light"] {
    background: #ffffff;
    color: #0d0c1d;
  }


  section[data-nav-theme="dark"] {
    background: #0d0c1d;
    color: #ffffff;
  }


  section h2 {
    font-size: clamp(28px, 5vw, 56px);

    font-weight: 600;

    letter-spacing: -.02em;
  }


  section p {
    margin-top: 12px;

    opacity: .6;

    font-size: 15px;
  }


</style>
</head>


<body>


  <!-- =======================================================
       NAVBAR
  ======================================================= -->

  <nav
    class="nav"
    data-theme="light"
  >

    <div class="nav__inner">


      <!-- ===================================================
           LOGO
      =================================================== -->

      <a
        class="nav__logo"
        href="#home"
        aria-label="Home"
      >

        <!-- Dark logo -->

        <img
          data-for="light"
          src="https://cdn.prod.website-files.com/67723ef600ec83ca47fb9a97/67723ef600ec83ca47fb9c71_Logo_Primary.svg"
          alt="Logo"
        >


        <!-- White logo -->

        <img
          data-for="dark"
          src="https://cdn.prod.website-files.com/67723ef600ec83ca47fb9a97/67723ef600ec83ca47fb9c70_Asset%208.svg"
          alt="Logo"
        >

      </a>



      <!-- ===================================================
           DESKTOP NAV
      =================================================== -->

      <ul class="nav__links">

        <li>
          <a href="#home">Home</a>
        </li>

        <li>
          <a href="#about">About</a>
        </li>

        <li>
          <a href="#service">Service</a>
        </li>

        <li>
          <a href="#contact">Contact</a>
        </li>

        <li>
          <a href="#logistics">Logistics</a>
        </li>

      </ul>



      <!-- ===================================================
           MOBILE MENU BUTTON
      =================================================== -->

      <button
        class="nav__menu-button"
        type="button"
        aria-label="Open menu"
        aria-expanded="false"
      >

        <span class="nav__menu-icon">

          <span></span>
          <span></span>
          <span></span>

        </span>

      </button>


    </div>



    <!-- =====================================================
         MOBILE MENU
    ===================================================== -->

    <div class="nav__mobile-menu">

      <ul class="nav__mobile-links">

        <li>
          <a href="#home">Home</a>
        </li>

        <li>
          <a href="#about">About</a>
        </li>

        <li>
          <a href="#service">Service</a>
        </li>

        <li>
          <a href="#contact">Contact</a>
        </li>

        <li>
          <a href="#logistics">Logistics</a>
        </li>

      </ul>

    </div>

  </nav>



  <!-- =======================================================
       PAGE
  ======================================================= -->

  <main>


    <section
      id="home"
      data-nav-theme="dark"
    >

      <div>

        <h2>Home</h2>

        <p>
          navy section, nav goes white
        </p>

      </div>

    </section>



    <section
      id="about"
      data-nav-theme="light"
    >

      <div>

        <h2>About</h2>

        <p>
          white section, nav goes dark
        </p>

      </div>

    </section>



    <section
      id="service"
      data-nav-theme="dark"
    >

      <div>

        <h2>Service</h2>

        <p>
          navy again
        </p>

      </div>

    </section>



    <section
      id="contact"
      data-nav-theme="light"
    >

      <div>

        <h2>Contact</h2>

        <p>
          white again
        </p>

      </div>

    </section>



    <section
      id="logistics"
      data-nav-theme="dark"
    >

      <div>

        <h2>Logistics</h2>

        <p>
          navy
        </p>

      </div>

    </section>


  </main>



  <!-- =======================================================
       NAV THEME + MOBILE MENU LOGIC
  ======================================================= -->

  <script>

    (function () {

      const nav =
        document.querySelector('.nav');

      const sections =
        document.querySelectorAll(
          '[data-nav-theme]'
        );

      const menuButton =
        document.querySelector(
          '.nav__menu-button'
        );

      const mobileLinks =
        document.querySelectorAll(
          '.nav__mobile-links a'
        );


      /* =====================================================
         THEME DETECTION
      ===================================================== */

      function updateNavTheme() {

        const navHeight =
          nav.offsetHeight;

        const checkY =
          navHeight + 1;

        let activeSection = null;


        sections.forEach(function (section) {

          const rect =
            section.getBoundingClientRect();


          /*
            Find the section physically
            underneath the navbar.
          */

          if (
            rect.top <= checkY &&
            rect.bottom > checkY
          ) {

            activeSection = section;

          }

        });


        if (!activeSection) return;


        const theme =
          activeSection.getAttribute(
            'data-nav-theme'
          );


        /*
          Only update when the theme
          actually changes.
        */

        if (
          nav.getAttribute('data-theme') !== theme
        ) {

          nav.setAttribute(
            'data-theme',
            theme
          );

        }

      }


      /* Initial theme */

      updateNavTheme();


      /* =====================================================
         SCROLL
      ===================================================== */

      let ticking = false;


      window.addEventListener(
        'scroll',
        function () {

          if (ticking) return;


          window.requestAnimationFrame(
            function () {

              updateNavTheme();

              ticking = false;

            }
          );


          ticking = true;

        },
        {
          passive: true
        }
      );


      /* =====================================================
         RESIZE
      ===================================================== */

      window.addEventListener(
        'resize',
        updateNavTheme
      );


      /* =====================================================
         MOBILE MENU
      ===================================================== */

      function closeMenu() {

        nav.classList.remove(
          'menu-open'
        );

        menuButton.setAttribute(
          'aria-expanded',
          'false'
        );

        menuButton.setAttribute(
          'aria-label',
          'Open menu'
        );

      }


      function toggleMenu() {

        const isOpen =
          nav.classList.toggle(
            'menu-open'
          );


        menuButton.setAttribute(
          'aria-expanded',
          isOpen
        );


        menuButton.setAttribute(
          'aria-label',
          isOpen
            ? 'Close menu'
            : 'Open menu'
        );

      }


      menuButton.addEventListener(
        'click',
        toggleMenu
      );


      /* Close menu after selecting a link */

      mobileLinks.forEach(
        function (link) {

          link.addEventListener(
            'click',
            closeMenu
          );

        }
      );


      /*
        If the browser is resized back to desktop,
        make sure the mobile menu is closed.
      */

      window.addEventListener(
        'resize',
        function () {

          if (
            window.innerWidth > 767
          ) {

            closeMenu();

          }

        }
      );

    })();

  </script>


</body>
</html>
