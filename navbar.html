<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Nexigence Navbar</title>


  <style>

    /* =========================================================
       ROOT
    ========================================================= */

    :root {
      --nav-h: 72px;
      --mobile-nav-h: 64px;

      --maxw: 1500px;

      --ink: #0d0c1d;
      --paper: #ffffff;
    }


    /* =========================================================
       RESET
    ========================================================= */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    html,
    body {
      width: 100%;
      min-height: 100%;

      margin: 0;
      padding: 0;

      background: transparent;
    }


    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      overflow-x: hidden;
    }


    /* =========================================================
       NAVBAR — DESKTOP
    ========================================================= */

    .nav {

      position: fixed;

      /*
        Desktop top breathing room
      */

      top: 2vh;

      left: 50%;

      transform: translateX(-50%);

      /*
        Desktop max width
      */

      width: calc(100% - 4vw);

      max-width: var(--maxw);

      height: var(--nav-h);

      z-index: 1000;

      display: flex;
      align-items: center;

      /*
        Transparent glass navbar
      */

      background: transparent;

      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
    }


    /* =========================================================
       NAV INNER
    ========================================================= */

    .nav__inner {

      width: 100%;
      height: 100%;

      padding: 0 32px;

      display: flex;

      align-items: center;

      justify-content: space-between;
    }


    /* =========================================================
       LOGO
    ========================================================= */

    .nav__logo {

      position: relative;

      display: block;

      height: 28px;

      line-height: 0;

      flex-shrink: 0;
    }


    .nav__logo img {

      height: 28px;

      width: auto;

      display: block;

      position: absolute;

      top: 0;
      left: 0;

      /*
        No transition.
        Theme changes happen immediately.
      */

      transition: none;
    }


    /*
      Dark logo
      Used on light sections
    */

    .nav__logo img[data-for="light"] {

      position: relative;

      opacity: 1;
    }


    /*
      White logo
      Used on dark sections
    */

    .nav__logo img[data-for="dark"] {

      opacity: 0;
    }


    /* =========================================================
       DESKTOP NAV LINKS
    ========================================================= */

    .nav__links {

      display: flex;

      align-items: center;

      gap: 36px;

      list-style: none;

      position: absolute;

      left: 50%;

      transform: translateX(-50%);
    }


    .nav__links a {

      font-family: "Switzer", sans-serif;

      font-size: 15px;

      font-weight: 500;

      line-height: 1.2;

      letter-spacing: 0;

      text-decoration: none;

      color: var(--ink);

      opacity: .85;

      transition: opacity .2s ease;
    }


    .nav__links a:hover {

      opacity: 1;
    }


    /* =========================================================
       MOBILE MENU BUTTON
    ========================================================= */

    .nav__menu-button {

      display: none;

      width: 40px;

      height: 40px;

      padding: 0;

      border: 0;

      background: transparent;

      cursor: pointer;

      align-items: center;

      justify-content: center;

      flex-shrink: 0;
    }


    .nav__menu-icon {

      position: relative;

      width: 22px;

      height: 16px;
    }


    .nav__menu-icon span {

      position: absolute;

      left: 0;

      width: 22px;

      height: 1.5px;

      background: var(--ink);

      transition:
        transform .2s ease,
        opacity .2s ease;
    }


    .nav__menu-icon span:nth-child(1) {

      top: 2px;
    }


    .nav__menu-icon span:nth-child(2) {

      top: 8px;
    }


    .nav__menu-icon span:nth-child(3) {

      top: 14px;
    }


    /* =========================================================
       MOBILE MENU
    ========================================================= */

    .nav__mobile-menu {

      display: none;

      position: fixed;

      top: var(--mobile-nav-h);

      left: 0;

      width: 100%;

      min-height:
        calc(100vh - var(--mobile-nav-h));

      padding: 28px 20px 40px;

      /*
        Solid dark background.
        Page content no longer bleeds through.
      */

      background: #0D0C1D;

      opacity: 0;

      visibility: hidden;

      pointer-events: none;

      transform:
        translateY(-8px);

      transition:
        opacity .2s ease,
        transform .2s ease,
        visibility .2s ease;
    }


    /* =========================================================
       MOBILE MENU — DARK THEME
       (kept solid dark to match light theme)
    ========================================================= */

    .nav[data-theme="dark"]
    .nav__mobile-menu {

      background: #0D0C1D;
    }


    /* =========================================================
       MOBILE MENU LINKS
    ========================================================= */

    .nav__mobile-links {

      display: flex;

      flex-direction: column;

      gap: 24px;

      list-style: none;
    }


    /*
      Links are always white now,
      because the panel is always dark.
    */

    .nav__mobile-links a {

      font-family:
        "Switzer",
        sans-serif;

      font-size: 14px;

      font-weight: 500;

      line-height: 1.2;

      text-decoration: none;

      color: #ffffff;
    }


    .nav[data-theme="dark"]
    .nav__mobile-links a {

      color: #ffffff;
    }


    /* =========================================================
       MOBILE MENU OPEN
    ========================================================= */

    .nav.menu-open
    .nav__mobile-menu {

      opacity: 1;

      visibility: visible;

      pointer-events: auto;

      transform:
        translateY(0);
    }


    /* =========================================================
       HAMBURGER → X
    ========================================================= */

    .nav.menu-open
    .nav__menu-icon
    span:nth-child(1) {

      transform:
        translateY(6px)
        rotate(45deg);
    }


    .nav.menu-open
    .nav__menu-icon
    span:nth-child(2) {

      opacity: 0;
    }


    .nav.menu-open
    .nav__menu-icon
    span:nth-child(3) {

      transform:
        translateY(-6px)
        rotate(-45deg);
    }


    /* =========================================================
       DARK THEME — DESKTOP
    ========================================================= */

    .nav[data-theme="dark"]
    .nav__links a {

      color: #ffffff;
    }


    .nav[data-theme="dark"]
    .nav__logo
    img[data-for="light"] {

      opacity: 0;
    }


    .nav[data-theme="dark"]
    .nav__logo
    img[data-for="dark"] {

      opacity: 1;
    }


    .nav[data-theme="dark"]
    .nav__menu-icon span {

      background: #ffffff;
    }


    /* =========================================================
       MOBILE MODE
       
       Mobile is explicitly controlled by JS.
    ========================================================= */

    .nav.is-mobile {

      /*
        REMOVE DESKTOP SPACING
      */

      top: 0;

      left: 0;

      transform: none;

      /*
        EDGE TO EDGE
      */

      width: 100%;

      height: var(--mobile-nav-h);
    }


    .nav.is-mobile
    .nav__inner {

      padding:
        0 20px;
    }


    .nav.is-mobile
    .nav__logo {

      height: 26px;
    }


    .nav.is-mobile
    .nav__logo img {

      height: 26px;
    }


    /*
      Hide desktop links
    */

    .nav.is-mobile
    .nav__links {

      display: none;
    }


    /*
      Show hamburger
    */

    .nav.is-mobile
    .nav__menu-button {

      display: flex;
    }


    /*
      Mobile menu
    */

    .nav.is-mobile
    .nav__mobile-menu {

      display: block;

      top:
        var(--mobile-nav-h);

      left: 0;

      width: 100%;

      min-height:
        calc(100vh - var(--mobile-nav-h));

      padding:
        28px 20px 40px;
    }


    /*
      Mobile CTA/link size
    */

    .nav.is-mobile
    .nav__mobile-links a {

      font-size: 14px;

      font-weight: 500;

      line-height: 1.2;
    }


    /*
      MOBILE — LOCK NAVBAR TO DARK STYLING

      In mobile we ignore the section theme entirely.
      Logo stays white, hamburger stays white,
      so nothing changes color while scrolling and
      the close icon is always visible on the dark menu.
    */

    .nav.is-mobile
    .nav__logo
    img[data-for="light"] {

      opacity: 0;
    }


    .nav.is-mobile
    .nav__logo
    img[data-for="dark"] {

      opacity: 1;
    }


    .nav.is-mobile
    .nav__menu-icon span {

      background: #ffffff;
    }


    /* =========================================================
       DESKTOP MODE
    ========================================================= */

    .nav.is-desktop
    .nav__links {

      display: flex;
    }


    .nav.is-desktop
    .nav__menu-button {

      display: none;
    }


    .nav.is-desktop
    .nav__mobile-menu {

      display: none;
    }


  </style>

</head>


<body>


  <!-- =======================================================
       NAVBAR
  ======================================================= -->

  <nav
    class="nav is-desktop"
    data-theme="light"
  >


    <div class="nav__inner">


      <!-- =====================================================
           LOGO
      ===================================================== -->

      <a
        class="nav__logo"
        href="/"
        aria-label="Nexigence Home"
      >

        <!-- Dark logo -->

        <img
          data-for="light"
          src="https://cdn.prod.website-files.com/67723ef600ec83ca47fb9a97/67723ef600ec83ca47fb9c71_Logo_Primary.svg"
          alt="Nexigence"
        >


        <!-- White logo -->

        <img
          data-for="dark"
          src="https://cdn.prod.website-files.com/67723ef600ec83ca47fb9a97/67723ef600ec83ca47fb9c70_Asset%208.svg"
          alt="Nexigence"
        >

      </a>


      <!-- =====================================================
           DESKTOP NAV
      ===================================================== -->

      <ul class="nav__links">

        <li>
          <a href="https://nexigence-4672f96d5b2382a70aa024f13c72e.webflow.io/home">
            Home
          </a>
        </li>

        <li>
          <a href="https://nexigence-4672f96d5b2382a70aa024f13c72e.webflow.io/about-us">
            About
          </a>
        </li>

        <li>
          <a href="https://nexigence-4672f96d5b2382a70aa024f13c72e.webflow.io/nexservices">
            Service
          </a>
        </li>

        <li>
          <a href="https://nexigence-4672f96d5b2382a70aa024f13c72e.webflow.io/contact-us">
            Contact
          </a>
        </li>

        <li>
          <a href="/logistics">
            Logistics
          </a>
        </li>

      </ul>


      <!-- =====================================================
           MOBILE MENU BUTTON
      ===================================================== -->

      <button
        class="nav__menu-button"
        type="button"
        aria-label="Open menu"
        aria-expanded="false"
      >

        <span class="nav__menu-icon">

          <span></span>

          <span></span>

          <span></span>

        </span>

      </button>


    </div>


    <!-- =====================================================
         MOBILE MENU
    ===================================================== -->

    <div class="nav__mobile-menu">

      <ul class="nav__mobile-links">

        <li>
          <a href="https://nexigence-4672f96d5b2382a70aa024f13c72e.webflow.io/home">
            Home
          </a>
        </li>

        <li>
          <a href="https://nexigence-4672f96d5b2382a70aa024f13c72e.webflow.io/about-us">
            About
          </a>
        </li>

        <li>
          <a href="https://nexigence-4672f96d5b2382a70aa024f13c72e.webflow.io/nexservices">
            Service
          </a>
        </li>

        <li>
          <a href="https://nexigence-4672f96d5b2382a70aa024f13c72e.webflow.io/contact-us">
            Contact
          </a>
        </li>

        <li>
          <a href="/logistics">
            Logistics
          </a>
        </li>

      </ul>

    </div>


  </nav>


  <!-- =======================================================
       JAVASCRIPT
  ======================================================= -->

  <script>

    (function () {


      /* =====================================================
         ELEMENTS
      ===================================================== */

      const nav =
        document.querySelector(
          '.nav'
        );


      const menuButton =
        document.querySelector(
          '.nav__menu-button'
        );


      const mobileLinks =
        document.querySelectorAll(
          '.nav__mobile-links a'
        );


      /* =====================================================
         LOCK / UNLOCK PAGE SCROLL

         This navbar is a transparent full-viewport embed,
         so the real page scrolls in the PARENT window.
         We lock the parent directly (same-origin), and
         fall back to a postMessage + local lock otherwise.
      ===================================================== */

      function lockPageScroll(lock) {

        const value = lock ? 'hidden' : '';


        /*
          Local (covers non-iframe embeds)
        */

        document.documentElement.style.overflow = value;
        document.body.style.overflow = value;


        /*
          Parent page
        */

        try {

          if (
            window.parent &&
            window.parent !== window
          ) {

            window.parent.document
              .documentElement.style.overflow = value;

            window.parent.document
              .body.style.overflow = value;

          }

        } catch (e) {

          /*
            Cross-origin fallback.
            Requires a small listener in Webflow.
          */

          try {

            window.parent.postMessage(
              {
                type: 'NEXIGENCE_NAV_MENU',
                open: lock
              },
              '*'
            );

          } catch (e2) {}

        }

      }


      /* =====================================================
         RESPONSIVE MODE
      ===================================================== */

      function updateResponsiveMode() {

        const isMobile =
          window.innerWidth <= 767;


        nav.classList.toggle(
          'is-mobile',
          isMobile
        );


        nav.classList.toggle(
          'is-desktop',
          !isMobile
        );


        /*
          Close mobile menu when
          returning to desktop.
        */

        if (!isMobile) {

          closeMenu();

        }

      }


      /*
        Initial responsive check
      */

      updateResponsiveMode();


      /*
        Update on resize
      */

      window.addEventListener(
        'resize',
        updateResponsiveMode
      );


      /* =====================================================
         RECEIVE THEME FROM WEBFLOW
      ===================================================== */

      window.addEventListener(
        'message',
        function (event) {

          if (!event.data) {
            return;
          }


          if (
            event.data.type !==
            'NEXIGENCE_NAV_THEME'
          ) {

            return;

          }


          const theme =
            event.data.theme;


          if (
            theme !== 'light' &&
            theme !== 'dark'
          ) {

            return;

          }


          /*
            Apply theme immediately.

            No transition.
            No artificial delay.
          */

          nav.setAttribute(
            'data-theme',
            theme
          );

        }
      );


      /* =====================================================
         CLOSE MENU
      ===================================================== */

      function closeMenu() {

        nav.classList.remove(
          'menu-open'
        );


        lockPageScroll(false);


        if (menuButton) {

          menuButton.setAttribute(
            'aria-expanded',
            'false'
          );


          menuButton.setAttribute(
            'aria-label',
            'Open menu'
          );

        }

      }


      /* =====================================================
         TOGGLE MENU
      ===================================================== */

      function toggleMenu() {

        const isOpen =
          nav.classList.toggle(
            'menu-open'
          );


        /*
          Lock page scroll only in mobile.
        */

        lockPageScroll(
          isOpen &&
          nav.classList.contains('is-mobile')
        );


        menuButton.setAttribute(
          'aria-expanded',
          String(isOpen)
        );


        menuButton.setAttribute(
          'aria-label',
          isOpen
            ? 'Close menu'
            : 'Open menu'
        );

      }


      /* =====================================================
         HAMBURGER CLICK
      ===================================================== */

      menuButton.addEventListener(
        'click',
        toggleMenu
      );


      /* =====================================================
         MOBILE LINK CLICK
      ===================================================== */

      mobileLinks.forEach(
        function (link) {

          link.addEventListener(
            'click',
            closeMenu
          );

        }
      );


    })();

  </script>


</body>

</html>
