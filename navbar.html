<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Nexigence Navbar</title>


  <style>

    /* =========================================================
       ROOT
    ========================================================= */

    :root {
      --nav-h: 72px;
      --maxw: 1500px;

      --navy: #0d0c1d;
      --ink: #0d0c1d;
      --paper: #ffffff;
    }


    /* =========================================================
       RESET
    ========================================================= */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }


    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      background: transparent;
    }


    /* =========================================================
       NAVBAR
    ========================================================= */

    .nav {

      position: fixed;

      top: 0;
      left: 0;

      width: 100%;
      height: var(--nav-h);

      z-index: 1000;

      display: flex;
      align-items: center;

      /*
        Transparent glass.

        No white overlay.
        No dark overlay.
      */

      background: transparent;

      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
    }


    /* =========================================================
       NAV INNER
    ========================================================= */

    .nav__inner {

      width: 100%;
      max-width: var(--maxw);

      height: 100%;

      margin: 0 auto;

      padding: 0 32px;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }


    /* =========================================================
       LOGO
    ========================================================= */

    .nav__logo {

      position: relative;

      display: block;

      height: 28px;

      line-height: 0;

      flex-shrink: 0;
    }


    .nav__logo img {

      height: 28px;
      width: auto;

      display: block;

      position: absolute;

      top: 0;
      left: 0;

      /*
        No transition.

        Theme changes immediately.
      */

      transition: none;
    }


    /* Dark logo */

    .nav__logo img[data-for="light"] {

      position: relative;

      opacity: 1;
    }


    /* White logo */

    .nav__logo img[data-for="dark"] {

      opacity: 0;
    }


    /* =========================================================
       DESKTOP NAV
    ========================================================= */

    .nav__links {

      display: flex;

      align-items: center;

      gap: 36px;

      list-style: none;

      position: absolute;

      left: 50%;

      transform: translateX(-50%);
    }


    .nav__links a {

      font-family: "Switzer", sans-serif;

      font-size: 15px;

      font-weight: 500;

      line-height: 1.2;

      letter-spacing: 0;

      text-decoration: none;

      color: var(--ink);

      opacity: .85;

      /*
        Only hover opacity animates.

        Theme color switches instantly.
      */

      transition: opacity .2s ease;
    }


    .nav__links a:hover {

      opacity: 1;
    }


    /* =========================================================
       MOBILE MENU BUTTON
    ========================================================= */

    .nav__menu-button {

      display: none;

      width: 40px;
      height: 40px;

      padding: 0;

      border: 0;

      background: transparent;

      cursor: pointer;

      align-items: center;

      justify-content: center;

      flex-shrink: 0;
    }


    .nav__menu-icon {

      position: relative;

      width: 22px;
      height: 16px;
    }


    .nav__menu-icon span {

      position: absolute;

      left: 0;

      width: 22px;
      height: 1.5px;

      background: var(--ink);

      transition:
        transform .2s ease,
        opacity .2s ease;
    }


    .nav__menu-icon span:nth-child(1) {

      top: 2px;
    }


    .nav__menu-icon span:nth-child(2) {

      top: 8px;
    }


    .nav__menu-icon span:nth-child(3) {

      top: 14px;
    }


    /* =========================================================
       MOBILE MENU
    ========================================================= */

    .nav__mobile-menu {

      display: none;

      position: fixed;

      top: var(--nav-h);

      left: 0;

      width: 100%;

      padding: 24px 32px 32px;

      background: transparent;

      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);

      opacity: 0;

      visibility: hidden;

      pointer-events: none;

      transform: translateY(-8px);

      transition:
        opacity .2s ease,
        transform .2s ease,
        visibility .2s ease;
    }


    .nav__mobile-links {

      display: flex;

      flex-direction: column;

      gap: 24px;

      list-style: none;
    }


    .nav__mobile-links a {

      font-family: "Switzer", sans-serif;

      font-size: 18px;

      font-weight: 500;

      line-height: 1.2;

      text-decoration: none;

      color: var(--ink);
    }


    /* =========================================================
       MOBILE MENU OPEN
    ========================================================= */

    .nav.menu-open .nav__mobile-menu {

      opacity: 1;

      visibility: visible;

      pointer-events: auto;

      transform: translateY(0);
    }


    .nav.menu-open
    .nav__menu-icon
    span:nth-child(1) {

      transform:
        translateY(6px)
        rotate(45deg);
    }


    .nav.menu-open
    .nav__menu-icon
    span:nth-child(2) {

      opacity: 0;
    }


    .nav.menu-open
    .nav__menu-icon
    span:nth-child(3) {

      transform:
        translateY(-6px)
        rotate(-45deg);
    }


    /* =========================================================
       DARK THEME
    ========================================================= */

    .nav[data-theme="dark"] {

      background: transparent;
    }


    .nav[data-theme="dark"]
    .nav__links a {

      color: var(--paper);
    }


    .nav[data-theme="dark"]
    .nav__logo
    img[data-for="light"] {

      opacity: 0;
    }


    .nav[data-theme="dark"]
    .nav__logo
    img[data-for="dark"] {

      opacity: 1;
    }


    .nav[data-theme="dark"]
    .nav__menu-icon span {

      background: var(--paper);
    }


    .nav[data-theme="dark"]
    .nav__mobile-links a {

      color: var(--paper);
    }


    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 767px) {

      .nav {

        height: 64px;
      }


      .nav__inner {

        padding: 0 20px;
      }


      .nav__logo {

        height: 26px;
      }


      .nav__logo img {

        height: 26px;
      }


      /* Hide desktop navigation */

      .nav__links {

        display: none;
      }


      /* Show hamburger */

      .nav__menu-button {

        display: flex;
      }


      /* Mobile dropdown */

      .nav__mobile-menu {

        display: block;

        top: 64px;

        padding:
          24px
          20px
          32px;
      }

    }


  </style>

</head>


<body>


  <!-- =======================================================
       NAVBAR
  ======================================================= -->

  <nav
    class="nav"
    data-theme="light"
  >

    <div class="nav__inner">


      <!-- =====================================================
           LOGO
      ===================================================== -->

      <a
        class="nav__logo"
        href="/"
        aria-label="Nexigence Home"
      >

        <!-- Dark logo -->

        <img
          data-for="light"
          src="https://cdn.prod.website-files.com/67723ef600ec83ca47fb9a97/67723ef600ec83ca47fb9c71_Logo_Primary.svg"
          alt="Nexigence"
        >


        <!-- White logo -->

        <img
          data-for="dark"
          src="https://cdn.prod.website-files.com/67723ef600ec83ca47fb9a97/67723ef600ec83ca47fb9c70_Asset%208.svg"
          alt="Nexigence"
        >

      </a>



      <!-- =====================================================
           DESKTOP NAV
      ===================================================== -->

      <ul class="nav__links">

        <li>
          <a href="/">Home</a>
        </li>

        <li>
          <a href="/about">About</a>
        </li>

        <li>
          <a href="/service">Service</a>
        </li>

        <li>
          <a href="/contact">Contact</a>
        </li>

        <li>
          <a href="/logistics">Logistics</a>
        </li>

      </ul>



      <!-- =====================================================
           MOBILE MENU BUTTON
      ===================================================== -->

      <button
        class="nav__menu-button"
        type="button"
        aria-label="Open menu"
        aria-expanded="false"
      >

        <span class="nav__menu-icon">

          <span></span>
          <span></span>
          <span></span>

        </span>

      </button>

    </div>



    <!-- =====================================================
         MOBILE MENU
    ===================================================== -->

    <div class="nav__mobile-menu">

      <ul class="nav__mobile-links">

        <li>
          <a href="/">Home</a>
        </li>

        <li>
          <a href="/about">About</a>
        </li>

        <li>
          <a href="/service">Service</a>
        </li>

        <li>
          <a href="/contact">Contact</a>
        </li>

        <li>
          <a href="/logistics">Logistics</a>
        </li>

      </ul>

    </div>

  </nav>



  <!-- =======================================================
       JAVASCRIPT
  ======================================================= -->

  <script>

    (function () {


      /* =====================================================
         ELEMENTS
      ===================================================== */

      const nav =
        document.querySelector('.nav');


      const menuButton =
        document.querySelector(
          '.nav__menu-button'
        );


      const mobileLinks =
        document.querySelectorAll(
          '.nav__mobile-links a'
        );



      /* =====================================================
         THEME DETECTION
      ===================================================== */

      /*
        IMPORTANT:

        Because this navbar is running inside
        an iframe, it cannot directly use
        document.querySelector() on the
        Webflow page.

        Instead we access the parent document.

        Your Webflow sections should have:

        data-nav-theme="dark"

        OR

        data-nav-theme="light"
      */

      function getParentSections() {

        try {

          return window.parent.document
            .querySelectorAll(
              '[data-nav-theme]'
            );

        } catch (error) {

          return [];

        }

      }


      function updateNavTheme() {

        const sections =
          getParentSections();


        if (!sections.length) {

          return;

        }


        /*
          The iframe navbar itself has
          a fixed height.

          We check the vertical position
          corresponding to the bottom edge
          of the navbar in the parent page.
        */

        const navHeight =
          nav.offsetHeight;


        /*
          Get the iframe's position relative
          to the parent Webflow page.
        */

        let iframeRect;


        try {

          iframeRect =
            window.frameElement
              .getBoundingClientRect();

        } catch (error) {

          return;

        }


        /*
          Position of the point directly
          underneath the navbar in the
          parent document.
        */

        const checkY =
          iframeRect.top +
          navHeight +
          1;


        let activeSection = null;


        sections.forEach(function (section) {

          const rect =
            section.getBoundingClientRect();


          if (
            rect.top <= checkY &&
            rect.bottom > checkY
          ) {

            activeSection = section;

          }

        });


        if (!activeSection) {

          return;

        }


        const theme =
          activeSection.getAttribute(
            'data-nav-theme'
          );


        /*
          Only update when the theme
          actually changes.

          No animation or delay.
        */

        if (
          nav.getAttribute('data-theme') !== theme
        ) {

          nav.setAttribute(
            'data-theme',
            theme
          );

        }

      }



      /* =====================================================
         INITIAL THEME
      ===================================================== */

      updateNavTheme();



      /* =====================================================
         SCROLL
      ===================================================== */

      let ticking = false;


      function handleScroll() {

        if (ticking) {

          return;

        }


        window.requestAnimationFrame(
          function () {

            updateNavTheme();

            ticking = false;

          }
        );


        ticking = true;

      }


      /*
        Listen to the parent Webflow page.

        This is important because the actual
        scrolling happens outside the iframe.
      */

      try {

        window.parent.addEventListener(
          'scroll',
          handleScroll,
          {
            passive: true
          }
        );

      } catch (error) {

        window.addEventListener(
          'scroll',
          handleScroll,
          {
            passive: true
          }
        );

      }



      /* =====================================================
         RESIZE
      ===================================================== */

      window.addEventListener(
        'resize',
        updateNavTheme
      );


      try {

        window.parent.addEventListener(
          'resize',
          updateNavTheme
        );

      } catch (error) {

        // Ignore parent access errors.

      }



      /* =====================================================
         MOBILE MENU
      ===================================================== */

      function closeMenu() {

        nav.classList.remove(
          'menu-open'
        );


        menuButton.setAttribute(
          'aria-expanded',
          'false'
        );


        menuButton.setAttribute(
          'aria-label',
          'Open menu'
        );

      }


      function toggleMenu() {

        const isOpen =
          nav.classList.toggle(
            'menu-open'
          );


        menuButton.setAttribute(
          'aria-expanded',
          String(isOpen)
        );


        menuButton.setAttribute(
          'aria-label',
          isOpen
            ? 'Close menu'
            : 'Open menu'
        );

      }


      menuButton.addEventListener(
        'click',
        toggleMenu
      );



      /* =====================================================
         CLOSE MOBILE MENU AFTER NAVIGATION
      ===================================================== */

      mobileLinks.forEach(
        function (link) {

          link.addEventListener(
            'click',
            closeMenu
          );

        }
      );



      /* =====================================================
         CLOSE MOBILE MENU WHEN RETURNING TO DESKTOP
      ===================================================== */

      window.addEventListener(
        'resize',
        function () {

          if (
            window.innerWidth > 767
          ) {

            closeMenu();

          }

        }
      );


    })();

  </script>


</body>

</html>
