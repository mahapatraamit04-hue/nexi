<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Nexigence Navbar</title>


  <style>

    :root {
      --nav-h: 72px;
      --maxw: 1500px;

      --navy: #0d0c1d;
      --ink: #0d0c1d;
      --paper: #ffffff;
    }


    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: transparent;
    }


    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
    }


    /* =========================================================
       NAVBAR
    ========================================================= */

   .nav {
  position: fixed;

  top: 2vh;
  left: 50%;
  transform: translateX(-50%);

  width: calc(100% - 4vw);
  max-width: 1500px;

  height: var(--nav-h);

  z-index: 1000;

  display: flex;
  align-items: center;

  background: transparent;

  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
}


    /* =========================================================
       NAV INNER
    ========================================================= */

    .nav__inner {
  width: 100%;
  height: 100%;

  padding: 0 32px;

  display: flex;
  align-items: center;
  justify-content: space-between;
}

    /* =========================================================
       LOGO
    ========================================================= */

    .nav__logo {
      position: relative;

      display: block;

      height: 28px;
      line-height: 0;

      flex-shrink: 0;
    }


    .nav__logo img {
      height: 28px;
      width: auto;

      display: block;

      position: absolute;

      top: 0;
      left: 0;

      /*
        IMPORTANT:
        No transition.
        Theme changes immediately.
      */

      transition: none;
    }


    /* Dark logo */

    .nav__logo img[data-for="light"] {
      position: relative;
      opacity: 1;
    }


    /* White logo */

    .nav__logo img[data-for="dark"] {
      opacity: 0;
    }


    /* =========================================================
       DESKTOP NAV
    ========================================================= */

    .nav__links {
      display: flex;
      align-items: center;

      gap: 36px;

      list-style: none;

      position: absolute;

      left: 50%;
      transform: translateX(-50%);
    }


    .nav__links a {
      font-family: "Switzer", sans-serif;

      font-size: 15px;
      font-weight: 500;
      line-height: 1.2;

      letter-spacing: 0;

      text-decoration: none;

      color: var(--ink);

      opacity: .85;

      transition: opacity .2s ease;
    }


    .nav__links a:hover {
      opacity: 1;
    }


    /* =========================================================
       MOBILE BUTTON
    ========================================================= */

    .nav__menu-button {
      display: none;

      width: 40px;
      height: 40px;

      padding: 0;

      border: 0;
      background: transparent;

      cursor: pointer;

      align-items: center;
      justify-content: center;
    }


    .nav__menu-icon {
      position: relative;

      width: 22px;
      height: 16px;
    }


    .nav__menu-icon span {
      position: absolute;

      left: 0;

      width: 22px;
      height: 1.5px;

      background: var(--ink);

      transition:
        transform .2s ease,
        opacity .2s ease;
    }


    .nav__menu-icon span:nth-child(1) {
      top: 2px;
    }


    .nav__menu-icon span:nth-child(2) {
      top: 8px;
    }


    .nav__menu-icon span:nth-child(3) {
      top: 14px;
    }


    /* =========================================================
       MOBILE MENU
    ========================================================= */

    .nav__mobile-menu {
      display: none;

      position: fixed;

      top: var(--nav-h);
      left: 0;

      width: 100%;

      padding: 24px 32px 32px;

      background: transparent;

      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);

      opacity: 0;
      visibility: hidden;
      pointer-events: none;

      transform: translateY(-8px);

      transition:
        opacity .2s ease,
        transform .2s ease,
        visibility .2s ease;
    }


    .nav__mobile-links {
      display: flex;
      flex-direction: column;

      gap: 24px;

      list-style: none;
    }


    .nav__mobile-links a {
      font-family: "Switzer", sans-serif;

      font-size: 18px;
      font-weight: 500;
      line-height: 1.2;

      text-decoration: none;

      color: var(--ink);
    }


    /* =========================================================
       MOBILE OPEN
    ========================================================= */

    .nav.menu-open .nav__mobile-menu {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;

      transform: translateY(0);
    }


    .nav.menu-open
    .nav__menu-icon
    span:nth-child(1) {
      transform:
        translateY(6px)
        rotate(45deg);
    }


    .nav.menu-open
    .nav__menu-icon
    span:nth-child(2) {
      opacity: 0;
    }


    .nav.menu-open
    .nav__menu-icon
    span:nth-child(3) {
      transform:
        translateY(-6px)
        rotate(-45deg);
    }


    /* =========================================================
       DARK THEME
    ========================================================= */

    .nav[data-theme="dark"] {
      background: transparent;
    }


    .nav[data-theme="dark"]
    .nav__links a {
      color: #ffffff;
    }


    .nav[data-theme="dark"]
    .nav__logo
    img[data-for="light"] {
      opacity: 0;
    }


    .nav[data-theme="dark"]
    .nav__logo
    img[data-for="dark"] {
      opacity: 1;
    }


    .nav[data-theme="dark"]
    .nav__menu-icon span {
      background: #ffffff;
    }


    .nav[data-theme="dark"]
    .nav__mobile-links a {
      color: #ffffff;
    }


    /* =========================================================
       MOBILE
    ========================================================= */

@media (max-width: 767px) {

  .nav {
    top: 2vh;

    width: calc(100% - 32px);

    height: 64px;
  }

  .nav__inner {
    padding: 0 20px;
  }

  .nav__mobile-menu {
    top: 64px;
  }

}

  </style>

</head>


<body>


  <!-- =======================================================
       NAVBAR
  ======================================================= -->

  <nav
    class="nav"
    data-theme="light"
  >

    <div class="nav__inner">


      <!-- LOGO -->

      <a
        class="nav__logo"
        href="/"
        aria-label="Nexigence Home"
      >

        <img
          data-for="light"
          src="https://cdn.prod.website-files.com/67723ef600ec83ca47fb9a97/67723ef600ec83ca47fb9c71_Logo_Primary.svg"
          alt="Nexigence"
        >


        <img
          data-for="dark"
          src="https://cdn.prod.website-files.com/67723ef600ec83ca47fb9a97/67723ef600ec83ca47fb9c70_Asset%208.svg"
          alt="Nexigence"
        >

      </a>


      <!-- DESKTOP NAV -->

      <ul class="nav__links">

        <li>
          <a href="/">Home</a>
        </li>

        <li>
          <a href="/about">About</a>
        </li>

        <li>
          <a href="/service">Service</a>
        </li>

        <li>
          <a href="/contact">Contact</a>
        </li>

        <li>
          <a href="/logistics">Logistics</a>
        </li>

      </ul>


      <!-- MOBILE BUTTON -->

      <button
        class="nav__menu-button"
        type="button"
        aria-label="Open menu"
        aria-expanded="false"
      >

        <span class="nav__menu-icon">

          <span></span>
          <span></span>
          <span></span>

        </span>

      </button>

    </div>


    <!-- MOBILE MENU -->

    <div class="nav__mobile-menu">

      <ul class="nav__mobile-links">

        <li>
          <a href="/">Home</a>
        </li>

        <li>
          <a href="/about">About</a>
        </li>

        <li>
          <a href="/service">Service</a>
        </li>

        <li>
          <a href="/contact">Contact</a>
        </li>

        <li>
          <a href="/logistics">Logistics</a>
        </li>

      </ul>

    </div>

  </nav>


  <!-- =======================================================
       JAVASCRIPT
  ======================================================= -->

  <script>

    (function () {

      const nav =
        document.querySelector('.nav');

      const menuButton =
        document.querySelector(
          '.nav__menu-button'
        );

      const mobileLinks =
        document.querySelectorAll(
          '.nav__mobile-links a'
        );


      /* =====================================================
         RECEIVE THEME FROM WEBFLOW
      ===================================================== */

      window.addEventListener(
        'message',
        function (event) {

          /*
            We only care about messages
            containing a theme.
          */

          if (!event.data) return;


          if (
            event.data.type !==
            'NEXIGENCE_NAV_THEME'
          ) {
            return;
          }


          const theme =
            event.data.theme;


          if (
            theme !== 'light' &&
            theme !== 'dark'
          ) {
            return;
          }


          /*
            Immediate theme change.
            No delay.
          */

          nav.setAttribute(
            'data-theme',
            theme
          );

        }
      );


      /* =====================================================
         MOBILE MENU
      ===================================================== */

      function closeMenu() {

        nav.classList.remove(
          'menu-open'
        );


        menuButton.setAttribute(
          'aria-expanded',
          'false'
        );


        menuButton.setAttribute(
          'aria-label',
          'Open menu'
        );

      }


      function toggleMenu() {

        const isOpen =
          nav.classList.toggle(
            'menu-open'
          );


        menuButton.setAttribute(
          'aria-expanded',
          String(isOpen)
        );


        menuButton.setAttribute(
          'aria-label',
          isOpen
            ? 'Close menu'
            : 'Open menu'
        );

      }


      menuButton.addEventListener(
        'click',
        toggleMenu
      );


      mobileLinks.forEach(
        function (link) {

          link.addEventListener(
            'click',
            closeMenu
          );

        }
      );


      window.addEventListener(
        'resize',
        function () {

          if (
            window.innerWidth > 767
          ) {

            closeMenu();

          }

        }
      );

    })();

  </script>


</body>

</html>
