<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Signals</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  :root {
    --head-active: #f4f4f6;
    --head-idle: rgba(244,244,246,0.42);
    --sub: rgba(244,244,246,0.55);
    --track: rgba(255,255,255,0.12);
    --fill: rgba(255,255,255,0.9);
  }

  .seq-shell {
    display: flex; align-items: center; justify-content: center;
    width: 100%; min-height: 100vh;
    background: #0D0C1D;
    font-family: "Switzer", system-ui, -apple-system, sans-serif;
    color: var(--head-active);
  }
  .seq-inner {
    width: 100%; max-width: 1500px;
    display: flex; align-items: center;
    padding: 0 6%;
  }

  /* LEFT: content */
  .seq-left {
    flex: 0 0 40%; 
    display: flex; flex-direction: column; justify-content: center;
    padding-right: 56px;
  }
  .seq-heading {
    font-size: 40px; font-weight: 500; line-height: 1.15; letter-spacing: -0.02em;
    margin: 0 0 44px; max-width: 40ch;
  }
  .seq-items { display: flex; flex-direction: column; gap: 26px; }
  .seq-item { cursor: pointer; }
  .item-head {
    display: block; width: 100%; text-align: left; background: none; border: none;
    padding: 0; margin: 0; cursor: pointer; font-family: inherit;
    font-size: 24px; font-weight: 500; letter-spacing: -0.01em; line-height: 1.3;
    color: var(--head-idle); transition: color .25s ease;
  }
  .seq-item.is-active .item-head { color: var(--head-active); }
  .item-body {
    max-height: 0; opacity: 0; overflow: hidden;
    transition: max-height .25s ease, opacity .25s ease, margin .25s ease;
  }
  .seq-item.is-active .item-body { max-height: 140px; opacity: 1; margin-top: 14px; }
  .item-sub { margin: 0 0 18px; font-size: 18px; line-height: 1.55; color: var(--sub); }
  .item-progress {
    position: relative; height: 2px; width: 100%;
    background: var(--track); border-radius: 2px; overflow: hidden;
  }
  .bar-fill {
    position: absolute; left: 0; top: 0; height: 100%; width: 0; background: var(--fill);
  }

  .seq-mnav { display: none; }   /* mobile-only; hidden on desktop */

  /* RIGHT: animation */
  .seq-right {
    flex: 1 1 60%;
    display: flex; align-items: center; justify-content: center; min-width: 0;
  }
  .seq-animation-wrap {
    position: relative; width: 100%; aspect-ratio: 1300 / 1330; max-height: 88vh;
    display: flex; align-items: center; justify-content: center;
    overflow: visible;
  }
  .seq-stage {
    position: relative; width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    z-index: 0;
  }
  .seq-lottie { width: 100%; height: 100%; position: relative; z-index: 0; }
  .seq-lottie svg { shape-rendering: geometricPrecision; }

  /* ---- MOBILE: heading, then animation, then Attio-style bar row + active text ---- */
  @media (max-width: 860px) {
    .seq-shell { min-height: 0; }
    .seq-inner {
      flex-direction: column;
      max-width: 540px;
      padding: 56px 24px 64px;
      width: 100%;
      background: #0D0C1D;
    }

    .seq-left {
      display: contents;
    }

    .seq-heading {
      order: 1;
      text-align: center;
      margin: 0 auto 4px;
      max-width: 20ch;
      font-size: 32px;
      position: relative;
      z-index: 2;
    }

    .seq-right {
      order: 2;
      width: 100%;
      margin: 12px 0 0;
      position: relative;
      z-index: 0;
    }

    .seq-animation-wrap {
      position: relative;
      width: 100%;
      max-height: 58vh;
      overflow: visible;
      background: #0D0C1D;
      z-index: 0;
    }

    .seq-stage {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: visible;
      z-index: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .seq-lottie {
      position: relative;
      z-index: 0;
      width: 100%;
      height: 100%;
      transform: scale(2.2);
      transform-origin: center center;
      will-change: transform;
    }

    .seq-items {
      display: none;
    }

    /* Mobile progress/content stays in normal flow directly below the animation. */
    .seq-right {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      margin: 12px 0 0;
    }

    .seq-animation-wrap {
      width: 100%;
      max-height: 58vh;
      overflow: visible;
      margin-bottom: 60%;
    }

    .seq-mnav {
      display: block;
      position: relative;
      width: 100%;
      align-self: stretch;
      text-align: center;
      margin: 0;
      padding: 14px 24px 22px;
      background: #0D0C1D;
      z-index: 1;
      box-sizing: border-box;
    }

    .mbars {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 24px;
    }

    .mbar {
      flex: 1 1 0;
      max-width: 110px;
      height: 2px;
      padding: 0;
      border: none;
      background: var(--track);
      border-radius: 2px;
      position: relative;
      cursor: pointer;
    }

    .mfill {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 0;
      background: var(--fill);
      border-radius: 2px;
    }

    .mtitle {
      margin: 0 0 10px;
      font-size: 20px;
      font-weight: 500;
      color: var(--head-active);
    }

    .msub {
      margin: 0 auto;
      font-size: 16px;
      line-height: 1.55;
      color: var(--sub);
      max-width: 40ch;
    }
  }
</style>
</head>
<body>

<div class="seq-shell">
  <div class="seq-inner">
    <div class="seq-left">
      <h2 class="seq-heading">All of the signals, none of the noise. Ready to act on.</h2>
      <div class="seq-items">
        <div class="seq-item" data-index="0">
          <button class="item-head">Context</button>
          <div class="item-body">
            <p class="item-sub">Emails, calls, records, product usage, connected tools. All live.</p>
            <div class="item-progress"><span class="bar-fill"></span></div>
          </div>
        </div>
        <div class="seq-item" data-index="1">
          <button class="item-head">Agents + automations</button>
          <div class="item-body">
            <p class="item-sub">An always-on revenue engine. Prospect, follow-up, research, running 24/7.</p>
            <div class="item-progress"><span class="bar-fill"></span></div>
          </div>
        </div>
        <div class="seq-item" data-index="2">
          <button class="item-head">Ecosystem</button>
          <div class="item-body">
            <p class="item-sub">Attio wherever you work. Browser, inbox, Slack, terminal, agents.</p>
            <div class="item-progress"><span class="bar-fill"></span></div>
          </div>
        </div>
      </div>

    </div>

    <div class="seq-right">
      <div class="seq-animation-wrap">
        <div class="seq-stage">
          <div class="seq-lottie" id="seqLottie"></div>
        </div>
      </div>

      <!-- Mobile content overlay: sits above the animation and covers any export watermark/logo. -->
      <div class="seq-mnav">
        <div class="mbars">
          <button class="mbar" data-index="0"><span class="mfill"></span></button>
          <button class="mbar" data-index="1"><span class="mfill"></span></button>
          <button class="mbar" data-index="2"><span class="mfill"></span></button>
        </div>
        <h3 class="mtitle"></h3>
        <p class="msub"></p>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
<script>
(function () {
  var ANIMATION_URL = "https://cdn.prod.website-files.com/67723ef600ec83ca47fb9a97/6a7971ca990004e5de2a7b0c_1300-2%20(11).json";
  var FALLBACK_SEGMENTS = [
    { start: 0, end: 511 },
    { start: 557, end: 938 },
    { start: 938, end: 1140 }
  ];

  var mount = document.getElementById("seqLottie");
  var items = Array.prototype.slice.call(document.querySelectorAll(".seq-item"));
  var mfills = Array.prototype.slice.call(document.querySelectorAll(".mfill"));
  var mbars  = Array.prototype.slice.call(document.querySelectorAll(".mbar"));
  var mtitle = document.querySelector(".mtitle");
  var msub   = document.querySelector(".msub");
  var TEXTS  = items.map(function (el) {
    return { t: el.querySelector(".item-head").textContent, s: el.querySelector(".item-sub").textContent };
  });

  var CONFIG = {
    segments: FALLBACK_SEGMENTS.slice(),
    loopEnd: 1140,
    slowSpeed: 0.65,
    fadeFrames: 24,
    jumpSpeed: 4
  };

  var N = 3;
  var LOOP_END = CONFIG.loopEnd;
  var anim = null, mode = "auto", targetSeg = null, lockHi = false, lastHi = -1, curSpeed = 1;

  function normalizeName(name) {
    return String(name || "")
      .toLowerCase()
      .replace(/&/g, "and")
      .replace(/[^a-z0-9]+/g, " ")
      .trim();
  }

  function buildTimingFromMarkers(data) {
    if (!data || !Array.isArray(data.markers) || data.markers.length < 3) return false;

    var wanted = [
      normalizeName(TEXTS[0].t),
      normalizeName(TEXTS[1].t),
      normalizeName(TEXTS[2].t)
    ];

    var markers = data.markers.map(function (m) {
      return {
        name: normalizeName(m.cm || m.name),
        start: Number(m.tm) || 0,
        duration: Number(m.dr) || 0
      };
    });

    var found = wanted.map(function (wantedName) {
      return markers.find(function (m) {
        return m.name === wantedName || m.name.indexOf(wantedName) !== -1 || wantedName.indexOf(m.name) !== -1;
      });
    });

    if (found.some(function (m) { return !m; })) return false;

    CONFIG.segments = found.map(function (m, i) {
      var next = found[i + 1];
      var end = m.duration > 0 ? m.start + m.duration : (next ? next.start : Number(data.op || 0));
      return { start: m.start, end: end };
    });

    CONFIG.loopEnd = Math.max.apply(null, CONFIG.segments.map(function (s) { return s.end; }));
    if (!CONFIG.loopEnd && data.op) CONFIG.loopEnd = Number(data.op);
    LOOP_END = CONFIG.loopEnd;
    N = CONFIG.segments.length;
    return true;
  }

  function buildTimingFromData(data) {
    // Prefer timing markers exported in the animation itself.
    if (buildTimingFromMarkers(data)) return;

    // If the export has no markers, use its actual composition end rather than
    // looping past the animation's built-in frame range. The existing segment
    // boundaries remain as a safe fallback for this exact 3-part animation.
    if (data && Number(data.op)) {
      CONFIG.loopEnd = Math.min(CONFIG.loopEnd, Number(data.op));
      LOOP_END = CONFIG.loopEnd;
    }
  }

  function highlight(i) {
    items.forEach(function (el, idx) { el.classList.toggle("is-active", idx === i); });
  }

  function segAt(f) {
    for (var i = N - 1; i >= 0; i--) {
      if (f >= CONFIG.segments[i].start) return i;
    }
    return 0;
  }

  function setBar(pct) {
    var el = document.querySelector(".seq-item.is-active .bar-fill");
    if (el) el.style.width = (Math.max(0, Math.min(1, pct)) * 100) + "%";
  }

  function setMobileText(i) {
    if (mtitle) mtitle.textContent = TEXTS[i].t;
    if (msub) msub.textContent = TEXTS[i].s;
  }

  function setMobileBars(hi, pct) {
    for (var i = 0; i < mfills.length; i++) {
      var w = i < hi ? 1 : (i === hi ? pct : 0);
      mfills[i].style.width = (Math.max(0, Math.min(1, w)) * 100) + "%";
    }
  }

  function onFrame() {
    var f = anim.currentFrame;

    if (mode === "ff" && f >= CONFIG.segments[targetSeg].start) {
      mode = "auto";
      setSpeedTo(1);
      lockHi = false;
      targetSeg = null;
    }

    var hi = lockHi ? targetSeg : segAt(f);
    if (hi !== lastHi) {
      highlight(hi);
      setMobileText(hi);
      lastHi = hi;
    }

    if (mode === "auto") setSpeedTo(hi === N - 1 ? CONFIG.slowSpeed : 1);

    var fadeN = CONFIG.fadeFrames, op = 1;
    if (f > LOOP_END - fadeN) op = Math.max(0, (LOOP_END - f) / fadeN);
    else if (f < fadeN) op = f / fadeN;
    mount.style.opacity = op;

    var s = CONFIG.segments[hi];
    var pct = (f - s.start) / (s.end - s.start);
    setBar(pct);
    setMobileBars(hi, pct);
  }

  function setSpeedTo(v) {
    if (curSpeed !== v) {
      anim.setSpeed(v);
      curSpeed = v;
    }
  }

  function playLoop() {
    setSpeedTo(1);
    anim.playSegments([0, LOOP_END], true);
  }

  function clickTo(j) {
    var cur = segAt(anim.currentFrame);
    if (j > cur) {
      highlight(j);
      setMobileText(j);
      lastHi = j;
      lockHi = true;
      targetSeg = j;
      mode = "ff";
      setSpeedTo(CONFIG.jumpSpeed);
    } else {
      lockHi = false;
      mode = "auto";
      targetSeg = null;
      highlight(j);
      setMobileText(j);
      lastHi = j;
      setSpeedTo(1);
      anim.goToAndPlay(CONFIG.segments[j].start, true);
    }
  }

  items.forEach(function (el) {
    el.addEventListener("click", function () { clickTo(parseInt(el.getAttribute("data-index"), 10)); });
  });

  mbars.forEach(function (el) {
    el.addEventListener("click", function () { clickTo(parseInt(el.getAttribute("data-index"), 10)); });
  });

  function initAnimation(data) {
    buildTimingFromData(data);

    anim = lottie.loadAnimation({
      container: mount,
      renderer: "svg",
      loop: false,
      autoplay: false,
      animationData: data,
      rendererSettings: {
        progressiveLoad: false,
        preserveAspectRatio: "xMidYMid meet"
      }
    });

    anim.addEventListener("DOMLoaded", function () {
      highlight(0);
      setMobileText(0);
      playLoop();
    });
    anim.addEventListener("enterFrame", onFrame);
    anim.addEventListener("complete", function () { playLoop(); });
    anim.addEventListener("data_failed", function () { console.error("Lottie failed to load"); });
  }

  // Both desktop and mobile deliberately use the same Webflow-hosted export.
  // This removes the old embedded copy, so there is only one source of truth.
  fetch(ANIMATION_URL, { cache: "force-cache" })
    .then(function (response) {
      if (!response.ok) throw new Error("Animation HTTP " + response.status);
      return response.json();
    })
    .then(function (data) {
      initAnimation(data);
    })
    .catch(function (error) {
      console.error("Could not load Signals animation:", error);
    });
})();
</script>
</body>
</html>
