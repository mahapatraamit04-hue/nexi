<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Signals</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  :root {
    --head-active: #f4f4f6;
    --head-idle: rgba(244,244,246,0.42);
    --sub: rgba(244,244,246,0.55);
    --track: rgba(255,255,255,0.12);
    --fill: rgba(255,255,255,0.9);
  }

  .seq-shell {
    display: flex; align-items: center; justify-content: center;
    width: 100%; min-height: 100vh;
    background: #0D0C1D;
    font-family: "Switzer", system-ui, -apple-system, sans-serif;
    color: var(--head-active);
  }
  .seq-inner {
    width: 100%; max-width: 1500px;
    display: flex; align-items: center;
    padding: 0 6%;
  }

  /* LEFT: content */
  .seq-left {
    flex: 0 0 40%; max-width: 40%;
    display: flex; flex-direction: column; justify-content: center;
    padding-right: 56px;
  }
  .seq-heading {
    font-size: 40px; font-weight: 500; line-height: 1.15; letter-spacing: -0.02em;
    margin: 0 0 44px; max-width: 20ch;
  }
  .seq-items { display: flex; flex-direction: column; gap: 26px; }
  .seq-item { cursor: pointer; }
  .item-head {
    display: block; width: 100%; text-align: left; background: none; border: none;
    padding: 0; margin: 0; cursor: pointer; font-family: inherit;
    font-size: 24px; font-weight: 500; letter-spacing: -0.01em; line-height: 1.3;
    color: var(--head-idle); transition: color .25s ease;
  }
  .seq-item.is-active .item-head { color: var(--head-active); }
  .item-body {
    max-height: 0; opacity: 0; overflow: hidden;
    transition: max-height .25s ease, opacity .25s ease, margin .25s ease;
  }
  .seq-item.is-active .item-body { max-height: 140px; opacity: 1; margin-top: 14px; }
  .item-sub { margin: 0 0 18px; font-size: 18px; line-height: 1.55; color: var(--sub); }
  .item-progress {
    position: relative; height: 2px; width: 100%;
    background: var(--track); border-radius: 2px; overflow: hidden;
  }
  .bar-fill {
    position: absolute; left: 0; top: 0; height: 100%; width: 0; background: var(--fill);
  }

  .seq-mnav { display: none; }   /* mobile-only; hidden on desktop */

  /* RIGHT: animation */
  .seq-right {
    flex: 1 1 60%;
    display: flex; align-items: center; justify-content: center; min-width: 0;
  }
  .seq-stage {
    position: relative; width: 100%; aspect-ratio: 340 / 360; max-height: 88vh;
    display: flex; align-items: center; justify-content: center;
  }
  .seq-lottie { width: 100%; height: 100%; }

  /* ---- MOBILE: heading, then animation, then Attio-style bar row + active text ---- */
  @media (max-width: 860px) {
    .seq-shell { min-height: 0; }
    .seq-inner { flex-direction: column; max-width: 540px; padding: 56px 24px 64px; }
    .seq-left { display: contents; }                 /* promote children so animation can sit between */
    .seq-heading { order: 1; text-align: center; margin: 0 auto 4px; max-width: 20ch; font-size: 32px; }
    .seq-right { order: 2; width: 100%; margin: 12px 0; }
    .seq-stage { width: 100%; max-height: 58vh; }

    .seq-items { display: none; }                    /* desktop accordion hidden on mobile */

    .seq-mnav { display: block; order: 3; text-align: center; margin-top: 6px; }
    .mbars { display: flex; justify-content: center; gap: 10px; margin-bottom: 24px; }
    .mbar {
      flex: 1 1 0; max-width: 110px; height: 2px; padding: 0; border: none;
      background: var(--track); border-radius: 2px; position: relative; cursor: pointer;
    }
    .mfill { position: absolute; left: 0; top: 0; height: 100%; width: 0; background: var(--fill); border-radius: 2px; }
    .mtitle { margin: 0 0 10px; font-size: 20px; font-weight: 500; color: var(--head-active); }
    .msub { margin: 0 auto; font-size: 16px; line-height: 1.55; color: var(--sub); max-width: 40ch; }
  }
</style>
</head>

<script>
(function () {
  var CONFIG = {
    // The animation file sits in the same repo folder as this page.
    segments: [
      { start: 0,   end: 484  },  // Context               (0.00 - 8.06s)
      { start: 533, end: 834  },  // Agents + automations   (8.88 - 13.90s)
      { start: 865, end: 1043 }   // Ecosystem              (14.42 - 17.38s)
    ],
    loopEnd: 1043,      // loop right when the cone finishes — no frozen tail/pause
    slowSpeed: 0.65,    // Ecosystem plays slower so its bar isn't rushed (lower = slower)
    fadeFrames: 24,     // crossfade length at the loop (smooth fade-out + restart)
    jumpSpeed: 4
  };

  var N = CONFIG.segments.length;
  var mount = document.getElementById("seqLottie");
  var items = Array.prototype.slice.call(document.querySelectorAll(".seq-item"));
  var mfills = Array.prototype.slice.call(document.querySelectorAll(".mfill"));
  var mbars  = Array.prototype.slice.call(document.querySelectorAll(".mbar"));
  var mtitle = document.querySelector(".mtitle");
  var msub   = document.querySelector(".msub");
  var TEXTS  = items.map(function (el) {
    return { t: el.querySelector(".item-head").textContent, s: el.querySelector(".item-sub").textContent };
  });
  var LOOP_END = CONFIG.loopEnd;
  var anim = null, mode = "auto", targetSeg = null, lockHi = false, lastHi = -1, curSpeed = 1;

  function highlight(i) {
    items.forEach(function (el, idx) { el.classList.toggle("is-active", idx === i); });
  }
  function segAt(f) {
    for (var i = N - 1; i >= 0; i--) { if (f >= CONFIG.segments[i].start) return i; }
    return 0;
  }
  function setBar(pct) {
    var el = document.querySelector(".seq-item.is-active .bar-fill");
    if (el) el.style.width = (Math.max(0, Math.min(1, pct)) * 100) + "%";
  }
  function setMobileText(i) {
    if (mtitle) mtitle.textContent = TEXTS[i].t;
    if (msub) msub.textContent = TEXTS[i].s;
  }
  function setMobileBars(hi, pct) {
    for (var i = 0; i < mfills.length; i++) {
      var w = i < hi ? 1 : (i === hi ? pct : 0);   // past = full, current = filling, future = empty
      mfills[i].style.width = (Math.max(0, Math.min(1, w)) * 100) + "%";
    }
  }
  function onFrame() {
    var f = anim.currentFrame;
    if (mode === "ff" && f >= CONFIG.segments[targetSeg].start) {
      mode = "auto"; setSpeedTo(1); lockHi = false; targetSeg = null;
    }
    var hi = lockHi ? targetSeg : segAt(f);
    if (hi !== lastHi) { highlight(hi); setMobileText(hi); lastHi = hi; }

    if (mode === "auto") setSpeedTo(hi === N - 1 ? CONFIG.slowSpeed : 1);   // slow the last segment

    // crossfade at the loop: fade out as it ends, fade back in on restart (no frozen pause)
    var fadeN = CONFIG.fadeFrames, op = 1;
    if (f > LOOP_END - fadeN) op = Math.max(0, (LOOP_END - f) / fadeN);
    else if (f < fadeN) op = f / fadeN;
    mount.style.opacity = op;

    var s = CONFIG.segments[hi];
    var pct = (f - s.start) / (s.end - s.start);
    setBar(pct);
    setMobileBars(hi, pct);
  }
  function setSpeedTo(v) { if (curSpeed !== v) { anim.setSpeed(v); curSpeed = v; } }
  function playLoop() { setSpeedTo(1); anim.playSegments([0, LOOP_END], true); }

  function clickTo(j) {
    var cur = segAt(anim.currentFrame);
    if (j > cur) {
      highlight(j); setMobileText(j); lastHi = j; lockHi = true; targetSeg = j; mode = "ff";
      setSpeedTo(CONFIG.jumpSpeed);
    } else {
      lockHi = false; mode = "auto"; targetSeg = null;
      highlight(j); setMobileText(j); lastHi = j; setSpeedTo(1);
      anim.goToAndPlay(CONFIG.segments[j].start, true);
    }
  }
  items.forEach(function (el) {
    el.addEventListener("click", function () { clickTo(parseInt(el.getAttribute("data-index"), 10)); });
  });
  mbars.forEach(function (el) {
    el.addEventListener("click", function () { clickTo(parseInt(el.getAttribute("data-index"), 10)); });
  });

  anim = lottie.loadAnimation({
    container: mount,
    renderer: "svg",
    loop: false, autoplay: false,
    animationData: window.__ANIM__
  });
  anim.addEventListener("DOMLoaded", function () { highlight(0); setMobileText(0); playLoop(); });
  anim.addEventListener("enterFrame", onFrame);
  anim.addEventListener("complete", function () { playLoop(); });
  anim.addEventListener("data_failed", function () { console.error("Lottie failed to load"); });
