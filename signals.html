
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Signals</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  :root {
    --head-active: #f4f4f6;
    --head-idle: rgba(244,244,246,0.42);
    --sub: rgba(244,244,246,0.55);
    --track: rgba(255,255,255,0.12);
    --fill: rgba(255,255,255,0.9);
  }

  .seq-shell {
    display: flex; align-items: center; justify-content: center;
    width: 100%; min-height: 100vh;
    background: #0D0C1D;
    font-family: "Switzer", system-ui, -apple-system, sans-serif;
    color: var(--head-active);
  }
  .seq-inner {
    width: 100%; max-width: 1500px;
    display: flex; align-items: center;
    padding: 0 6%;
  }

  /* LEFT: content */
  .seq-left {
    flex: 0 0 40%; max-width: 40%;
    display: flex; flex-direction: column; justify-content: center;
    padding-right: 56px;
  }
  .seq-heading {
    font-size: 40px; font-weight: 500; line-height: 1.15; letter-spacing: -0.02em;
    margin: 0 0 44px; max-width: 20ch;
  }
  .seq-items { display: flex; flex-direction: column; gap: 26px; }
  .seq-item { cursor: pointer; }
  .item-head {
    display: block; width: 100%; text-align: left; background: none; border: none;
    padding: 0; margin: 0; cursor: pointer; font-family: inherit;
    font-size: 24px; font-weight: 500; letter-spacing: -0.01em; line-height: 1.3;
    color: var(--head-idle); transition: color .25s ease;
  }
  .seq-item.is-active .item-head { color: var(--head-active); }
  .item-body {
    max-height: 0; opacity: 0; overflow: hidden;
    transition: max-height .25s ease, opacity .25s ease, margin .25s ease;
  }
  .seq-item.is-active .item-body { max-height: 140px; opacity: 1; margin-top: 14px; }
  .item-sub { margin: 0 0 18px; font-size: 18px; line-height: 1.55; color: var(--sub); }
  .item-progress {
    position: relative; height: 2px; width: 100%;
    background: var(--track); border-radius: 2px; overflow: hidden;
  }
  .bar-fill {
    position: absolute; left: 0; top: 0; height: 100%; width: 0; background: var(--fill);
  }

  /* RIGHT: animation */
  .seq-right {
    flex: 1 1 60%;
    display: flex; align-items: center; justify-content: center; min-width: 0;
  }
  .seq-stage {
    position: relative; width: 100%; aspect-ratio: 1300 / 1330; max-height: 88vh;
    display: flex; align-items: center; justify-content: center;
  }
  .seq-lottie { width: 100%; height: 100%; }

  @media (max-width: 860px) {
    .seq-inner { flex-direction: column; padding: 40px 24px; }
    .seq-left { flex: none; max-width: 100%; padding-right: 0; }
    .seq-heading { font-size: 30px; }
    .seq-right { width: 100%; }
  }
</style>
</head>
<body>

<div class="seq-shell">
  <div class="seq-inner">
    <div class="seq-left">
      <h2 class="seq-heading">All of the signals, none of the noise. Ready to act on.</h2>
      <div class="seq-items">
        <div class="seq-item" data-index="0">
          <button class="item-head">Context</button>
          <div class="item-body">
            <p class="item-sub">Emails, calls, records, product usage, connected tools. All live.</p>
            <div class="item-progress"><span class="bar-fill"></span></div>
          </div>
        </div>
        <div class="seq-item" data-index="1">
          <button class="item-head">Agents + automations</button>
          <div class="item-body">
            <p class="item-sub">An always-on revenue engine. Prospect, follow-up, research, running 24/7.</p>
            <div class="item-progress"><span class="bar-fill"></span></div>
          </div>
        </div>
        <div class="seq-item" data-index="2">
          <button class="item-head">Ecosystem</button>
          <div class="item-body">
            <p class="item-sub">Attio wherever you work. Browser, inbox, Slack, terminal, agents.</p>
            <div class="item-progress"><span class="bar-fill"></span></div>
          </div>
        </div>
      </div>
    </div>

    <div class="seq-right">
      <div class="seq-stage"><div class="seq-lottie" id="seqLottie"></div></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
<script>
(function () {
  var CONFIG = {
  lottieSrc: "https://cdn.prod.website-files.com/67723ef600ec83ca47fb9a97/6a703dbc8860947ad7f4cbd9_1300-2%20(9).json",
    segments: [
      { start: 0,   end: 517  },  // Context
      { start: 517, end: 857  },  // Agents + automations
      { start: 857, end: 1297 }   // Ecosystem
    ],
    jumpSpeed: 4
  };

  var N = CONFIG.segments.length;
  var mount = document.getElementById("seqLottie");
  var items = Array.prototype.slice.call(document.querySelectorAll(".seq-item"));
  var LOOP_END = CONFIG.segments[N - 1].end;
  var anim = null, mode = "auto", targetSeg = null, lockHi = false, lastHi = -1;

  function highlight(i) {
    items.forEach(function (el, idx) { el.classList.toggle("is-active", idx === i); });
  }
  function segAt(f) {
    for (var i = 0; i < N; i++) { if (f < CONFIG.segments[i].end) return i; }
    return N - 1;
  }
  function setBar(pct) {
    var el = document.querySelector(".seq-item.is-active .bar-fill");
    if (el) el.style.width = (Math.max(0, Math.min(1, pct)) * 100) + "%";
  }
  function onFrame() {
    var f = anim.currentFrame;
    if (mode === "ff" && f >= CONFIG.segments[targetSeg].start) {
      mode = "auto"; anim.setSpeed(1); lockHi = false; targetSeg = null;
    }
    var hi = lockHi ? targetSeg : segAt(f);
    if (hi !== lastHi) { highlight(hi); lastHi = hi; }
    var s = CONFIG.segments[hi];
    setBar((f - s.start) / (s.end - s.start));
  }
  function playLoop() { anim.setSpeed(1); anim.playSegments([0, LOOP_END], true); }

  function clickTo(j) {
    var cur = segAt(anim.currentFrame);
    if (j > cur) {
      highlight(j); lastHi = j; lockHi = true; targetSeg = j; mode = "ff";
      anim.setSpeed(CONFIG.jumpSpeed);
    } else {
      lockHi = false; mode = "auto"; targetSeg = null;
      highlight(j); lastHi = j; anim.setSpeed(1);
      anim.goToAndPlay(CONFIG.segments[j].start, true);
    }
  }
  items.forEach(function (el) {
    el.addEventListener("click", function () { clickTo(parseInt(el.getAttribute("data-index"), 10)); });
  });

  anim = lottie.loadAnimation({
    container: mount,
    renderer: "canvas",                                  // canvas = no SVG IDs, so track mattes can't collide
    loop: false, autoplay: false,
    path: CONFIG.lottieSrc,
    rendererSettings: { clearCanvas: true, dpr: (window.devicePixelRatio || 1) }
  });
  anim.addEventListener("DOMLoaded", function () { highlight(0); playLoop(); });
  anim.addEventListener("enterFrame", onFrame);
  anim.addEventListener("complete", function () { playLoop(); });
  anim.addEventListener("data_failed", function () { console.error("Lottie failed to load:", CONFIG.lottieSrc); });
})();
</script>
</body>
</html>
