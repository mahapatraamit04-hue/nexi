<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="_ds/nocturne-8106efae-7437-458f-b17d-cd3be22bf70c/styles.css">
  <script src="_ds/nocturne-8106efae-7437-458f-b17d-cd3be22bf70c/_ds_bundle.js"></script>
  <style>
    html, body { margin: 0; padding: 0; background: #fff; }
    *, *::before, *::after { box-sizing: border-box; }
    a { color: var(--color-accent-300); text-decoration: none; }
    a:hover { color: var(--color-accent-200); }
  </style>
  <template id="__bundler_thumbnail">
    <svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
      <rect width="240" height="240" fill="#0d0c1d"/>
      <rect x="52" y="72" width="136" height="96" rx="10" fill="none" stroke="#9184d9" stroke-width="2"/>
      <g fill="none" stroke="#9184d9" stroke-width="2" opacity=".55">
        <circle cx="120" cy="120" r="18"/>
        <circle cx="120" cy="120" r="32" opacity=".6"/>
      </g>
    </svg>
  </template>
</helmet>
<section data-screen-label="Past pilot" data-nav-theme="light" ref="{{ stageRef }}" style="position: relative; background: #fff; height: 400vh; font-family: var(--font-body);">
  <div style="position: sticky; top: 0; height: 100vh; overflow: hidden;">
    <div ref="{{ boxRef }}" style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; clip-path: inset(27% 31% round 28px);">
      <dc-import name="DF Dark Blue" frame-height="100vh" show-heading="no" hint-size="100%,100vh"></dc-import>
    </div>
    <canvas ref="{{ dotsRef }}" data-dots="" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block; pointer-events: none;"></canvas>
    <div style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none;">
      <h2 data-beat="0" data-layer="ink" style="position: absolute; top: 4%; left: 3.7%; margin: 0; max-width: 22ch; font-family: var(--font-heading); font-weight: 500; font-size: clamp(20px, 2.1vw, 34px); line-height: 1.26; letter-spacing: -0.015em; color: #0d0c1d; text-wrap: pretty; transition: opacity 120ms linear;">Most AI initiatives never<br />make it past pilot.</h2>
      <h2 data-beat="1" data-layer="ink" style="position: absolute; top: 4%; left: 3.7%; margin: 0; max-width: 22ch; opacity: 0; font-family: var(--font-heading); font-weight: 500; font-size: clamp(20px, 2.1vw, 34px); line-height: 1.26; letter-spacing: -0.015em; color: #0d0c1d; text-wrap: pretty; transition: opacity 120ms linear;">We find where it earns<br />its place first.</h2>
      <h2 data-beat="2" data-layer="ink" style="position: absolute; top: 4%; left: 3.7%; margin: 0; max-width: 22ch; opacity: 0; font-family: var(--font-heading); font-weight: 500; font-size: clamp(20px, 2.1vw, 34px); line-height: 1.26; letter-spacing: -0.015em; color: #0d0c1d; text-wrap: pretty; transition: opacity 120ms linear;">Then hand your team<br />the keys. It stays.</h2>
    </div>
    <div ref="{{ litRef }}" style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; clip-path: inset(27% 31% round 28px);">
      <h2 data-beat="0" data-layer="lit" style="position: absolute; top: 4%; left: 3.7%; margin: 0; max-width: 22ch; font-family: var(--font-heading); font-weight: 500; font-size: clamp(20px, 2.1vw, 34px); line-height: 1.26; letter-spacing: -0.015em; color: #fff; text-wrap: pretty; transition: opacity 120ms linear;">Most AI initiatives never<br />make it past pilot.</h2>
      <h2 data-beat="1" data-layer="lit" style="position: absolute; top: 4%; left: 3.7%; margin: 0; max-width: 22ch; opacity: 0; font-family: var(--font-heading); font-weight: 500; font-size: clamp(20px, 2.1vw, 34px); line-height: 1.26; letter-spacing: -0.015em; color: #fff; text-wrap: pretty; transition: opacity 120ms linear;">We find where it earns<br />its place first.</h2>
      <h2 data-beat="2" data-layer="lit" style="position: absolute; top: 4%; left: 3.7%; margin: 0; max-width: 22ch; opacity: 0; font-family: var(--font-heading); font-weight: 500; font-size: clamp(20px, 2.1vw, 34px); line-height: 1.26; letter-spacing: -0.015em; color: #fff; text-wrap: pretty; transition: opacity 120ms linear;">Then hand your team<br />the keys. It stays.</h2>
    </div>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;immersion&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1.45,&quot;min&quot;:1,&quot;max&quot;:2.2,&quot;step&quot;:0.05,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Story&quot;},&quot;beatScroll&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;min&quot;:0.5,&quot;max&quot;:2,&quot;step&quot;:0.1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Story&quot;}}">
class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.stage = React.createRef();
    this.box = React.createRef();
    this.dots = React.createRef();
    this.lit = React.createRef();
    // last values pushed to the DOM, so a frame that changes nothing writes nothing
    this.lastOp = [-1, -1, -1];
    this.lastClip = '';
    this.lastTx = -1; this.lastTy = -1;
  }

  componentDidMount() {
    this.reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    this.applyHeight();
    this.buildDots(true);
    // glyph metrics move when the webfont lands, so the sample has to be taken again
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (!this.gone) { this.buildDots(true); this.frame(); } });
    this.onScroll = () => {
      if (this.queued) return;
      this.queued = true;
      requestAnimationFrame(() => { this.queued = false; this.frame(); });
    };
    window.addEventListener('scroll', this.onScroll, { passive: true });
    // when embedded in a cross-origin iframe the component can't see the parent page's
    // scroll, so the parent posts a 0..1 progress value and we drive the animation off that
    this.onMsg = (e) => {
      const d = e.data;
      if (d && typeof d.dcScroll === 'number') { this.extP = Math.min(1, Math.max(0, d.dcScroll)); this.onScroll(); }
    };
    window.addEventListener('message', this.onMsg);
    this.onResize = () => { this.buildDots(); this.onScroll(); };
    window.addEventListener('resize', this.onResize);
    // scrolled well past the section, every scroll frame was still recomputing a clip nobody
    // could see. the margin means the first visible frame is already the right one
    if (typeof IntersectionObserver === 'function' && this.stage.current) {
      this.io = new IntersectionObserver((es) => {
        const on = es[es.length - 1].isIntersecting;
        const was = this.live;
        this.live = on;
        if (on && !was) this.frame();
      }, { rootMargin: '20%' });
      this.io.observe(this.stage.current);
    } else {
      this.live = true;
    }
    this.frame();
    // the child DC mounts after this one, so at frame() time there is no canvas to hand
    // zoomK and scrollBias to — and a child mounting does not re-render the parent, so
    // nothing would set them until the first scroll. keep trying until it claims an owner
    const claim = () => {
      if (this.gone) return;
      const cv = this.childCanvas();
      // no attempt cap: __dofOwner is only assigned once three.js has arrived from a CDN,
      // which on a cold cache can outlast any timeout worth picking
      if (cv && cv.__dofOwner) { this.frame(); return; }
      this.claimRaf = requestAnimationFrame(claim);
    };
    claim();
  }

  // cached: querySelector on every scroll frame walks the subtree for a node that only
  // changes when the child remounts
  childCanvas() {
    if (this.dofCv && this.dofCv.isConnected) return this.dofCv;
    const st = this.stage.current;
    this.dofCv = st ? st.querySelector('canvas:not([data-dots])') : null;
    return this.dofCv;
  }

  // must run before frame() on BOTH paths: frame() derives the scroll span from the stage's
  // height, so a tweak that changed it would otherwise compute progress against a stale span
  applyHeight() {
    const st = this.stage.current;
    if (!st) return;
    st.style.height = this.reduced ? '100vh' : (100 + 300 * (this.props.beatScroll ?? 1)) + 'vh';
  }

  componentDidUpdate() {
    this.beats = null;
    this.dofCv = null;
    this.lastOp[0] = this.lastOp[1] = this.lastOp[2] = -1;
    this.lastClip = ''; this.lastTx = -1;
    this.applyHeight();
    this.buildDots(true);
    this.frame();
  }

  componentWillUnmount() {
    this.gone = true;
    cancelAnimationFrame(this.claimRaf);
    window.removeEventListener('scroll', this.onScroll);
    window.removeEventListener('message', this.onMsg);
    window.removeEventListener('resize', this.onResize);
    if (this.io) { this.io.disconnect(); this.io = null; }
    this.targets = null; this.jit = null; this.inkBuf = null; this.litBuf = null;
  }

  frame() {
    const st = this.stage.current, box = this.box.current, lit = this.lit.current;
    if (!st || !box) return;
    if (this.live === false) return;
    if (!this.beats) this.beats = Array.from(st.querySelectorAll('[data-beat]'));
    // a zero-size layout pass would latch garbage into the clip, the text position and
    // zoomK, and nothing recomputes until the next scroll — so refuse the frame outright
    const W = window.innerWidth, H = window.innerHeight;
    if (!W || !H) return;
    // a first buildDots() during a zero-size pass leaves no targets, and only a resize or
    // the font promise would ever retry — so recover here, where the size is known good
    if (!this.targets) this.buildDots(true);
    const r = st.getBoundingClientRect();
    const span = Math.max(1, r.height - H);
    const p = this.reduced ? 0 : (this.extP != null ? this.extP : Math.min(1, Math.max(0, -r.top / span)));
    const S = (x) => x * x * (3 - 2 * x);
    const seg = (a, b) => Math.min(1, Math.max(0, (p - a) / (b - a)));

    // the window opens through the beats and stays open — it reaches full as the last beat
    // resolves, then holds while that line is read and hands off to the next section
    let g = S(Math.min(1, p / 0.75));
    if (this.reduced) g = 0;
    // it opens to a card 74vh tall inside the page's horizontal padding, not to full bleed.
    // computed in px because that padding was a clamp, so the two ends of the
    // interpolation are in different units
    const endX = Math.min(92, Math.max(16, 0.042 * W)), endY = 0.13 * H;
    const vx = 0.31 * W + (endX - 0.31 * W) * g;
    const vy = 0.27 * H + (endY - 0.27 * H) * g;
    // ONE inset string drives both the animation window and the white text, so the colour
    // split lands exactly on the box edge instead of approximately, as a blend mode would
    const clip = 'inset(' + vy.toFixed(1) + 'px ' + vx.toFixed(1) + 'px round 28px)';
    if (clip !== this.lastClip) {
      this.lastClip = clip;
      box.style.clipPath = clip;
      if (lit) lit.style.clipPath = clip;
    }

    // the sentences themselves stay real DOM text, crisp and clipped exactly as before.
    // dots only exist for the handoff: between two beats the text steps aside and one
    // persistent dot pool carries the words out and back into their new arrangement
    let from = 2, to = 2, u = 0, moving = false;
    if (p < 0.20) { from = 0; to = 0; }
    else if (p < 0.44) { from = 0; to = 1; u = seg(0.20, 0.44); moving = true; }
    else if (p < 0.56) { from = 1; to = 1; }
    else if (p < 0.80) { from = 1; to = 2; u = seg(0.56, 0.80); moving = true; }
    const su = (a, b) => { const x = Math.min(1, Math.max(0, (u - a) / (b - a))); return x * x * (3 - 2 * x); };
    const op = [0, 0, 0];
    // at the very edges the dots sit exactly on the glyphs, so a short overlap there hides
    // the swap between solid type and dotted type instead of popping
    if (!moving) op[from] = 1;
    else { op[from] = 1 - su(0.02, 0.18); op[to] = su(0.82, 0.98); }

    // tx/ty depend only on the viewport, so the headings never move during a scroll — the
    // old code rewrote top and left on all six of them every frame, forcing a layout each time
    const tx = endX + 0.037 * (W - 2 * endX), ty = endY + 0.04 * (H - 2 * endY);
    const moved = tx !== this.lastTx || ty !== this.lastTy;
    const beats = this.beats, last = this.lastOp;
    for (let i = 0; i < beats.length; i++) {
      const el = beats[i];
      if (moved) {
        el.style.top = ty.toFixed(1) + 'px';
        el.style.left = tx.toFixed(1) + 'px';
      }
      const bi = Number(el.getAttribute('data-beat'));
      if (op[bi] !== last[bi]) el.style.opacity = op[bi].toFixed(3);
    }
    last[0] = op[0]; last[1] = op[1]; last[2] = op[2];
    this.lastTx = tx; this.lastTy = ty;

    if (moving) this.drawDots(tx, ty, from, to, u, vx, vy, W, H);
    else if (this.dctx && this.dotsDirty) { this.dctx.clearRect(0, 0, W, H); this.dotsDirty = false; }

    const cv = this.childCanvas();
    // ramped across the gaps rather than summed from the opacities, which would now stall
    // at zero whenever no beat is showing
    if (cv && cv.__dofOwner) {
      const o = cv.__dofOwner;
      o.scrollBias = 0.5 * S(seg(0.20, 0.44)) + 0.5 * S(seg(0.56, 0.80));
      // shrink the tunnel to fit the open window, normalised so the widest state still
      // frames exactly as it does today. without it the small box crops the tunnel's far
      // centre, which is where fog and defocus have already taken most of the ink out
      const fitNow = Math.min((W - 2 * vx) / W, (H - 2 * vy) / H);
      const fitMax = Math.min((W - 2 * endX) / W, (H - 2 * endY) / H);
      // fitting the tunnel to the window is right while the box is small — it stops the
      // crop landing on the empty far centre. but "fits" at full size is a small object in
      // a large frame, so the open end dollies past the frame instead: the tunnel mouth
      // runs off the edges and you are inside it rather than looking at it
      const im = 1 + (Math.max(1, Math.min(2.2, this.props.immersion ?? 1.45)) - 1) * g;
      o.zoomK = (fitNow / fitMax) * im;
    }
  }

  // one h2 -> the dot positions that spell it. the DOM text stays the source of truth, so
  // editing the copy re-forms the dots instead of drifting out of sync with them
  sampleBeat(el) {
    const cs = getComputedStyle(el);
    const fs = parseFloat(cs.fontSize) || 28;
    const lh = parseFloat(cs.lineHeight) || fs * 1.26;
    // \b[^>]* because the runtime injects attributes into the break at render time — the
    // live tag is <br data-dc-tpl="…">, which a /<br\s*\/?>/ pattern silently misses, and
    // the two lines then weld into one over-wide string
    const lines = el.innerHTML.split(/<br\b[^>]*>/i).map((t) => t.replace(/<[^>]*>/g, '').trim());
    const off = document.createElement('canvas');
    let g = off.getContext('2d');
    const font = cs.fontStyle + ' ' + cs.fontWeight + ' ' + fs + 'px ' + cs.fontFamily;
    g.font = font;
    let wMax = 0;
    for (const ln of lines) wMax = Math.max(wMax, g.measureText(ln).width);
    const w = Math.ceil(wMax + fs), h = Math.ceil(lines.length * lh + fs * 0.5);
    off.width = w; off.height = h;
    g = off.getContext('2d');
    g.font = font;
    if ('letterSpacing' in g && cs.letterSpacing !== 'normal') g.letterSpacing = cs.letterSpacing;
    g.textBaseline = 'top';
    g.fillStyle = '#fff';
    for (let i = 0; i < lines.length; i++) g.fillText(lines[i], 0, i * lh + (lh - fs) * 0.5);
    const d = g.getImageData(0, 0, w, h).data, pts = [];
    // stride sets the dot density — larger is sparser
    for (let y = 0; y < h; y += 4.2) {
      for (let x = 0; x < w; x += 4.2) {
        if (d[((y | 0) * w + (x | 0)) * 4 + 3] > 120) pts.push(x, y);
      }
    }
    return pts;
  }

  buildDots(force) {
    const st = this.stage.current, cvs = this.dots.current;
    if (!st || !cvs) return;
    const W = window.innerWidth, H = window.innerHeight;
    if (!W || !H) return;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    // mobile fires resize whenever the URL bar moves; re-rasterising three headings and
    // reading back their pixels for a viewport that did not change is pure waste
    if (!force && W === this.bw && H === this.bh && dpr === this.bdpr && this.targets) return;
    this.bw = W; this.bh = H; this.bdpr = dpr;
    cvs.width = Math.round(W * dpr); cvs.height = Math.round(H * dpr);
    const ctx = cvs.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.dctx = ctx;
    this.dotsDirty = false;
    const els = Array.from(st.querySelectorAll('[data-beat][data-layer="ink"]'));
    els.sort((a, b) => Number(a.getAttribute('data-beat')) - Number(b.getAttribute('data-beat')));
    const raw = els.map((el) => this.sampleBeat(el));
    if (raw.length < 2 || raw.some((r) => !r.length)) return;
    // one shared pool sized to the busiest sentence, sampled in scan order so a dot's two
    // homes are near each other and the morph reads as the words rearranging
    let N = 0;
    for (const r of raw) N = Math.max(N, r.length / 2);
    this.targets = raw.map((pts) => {
      const out = new Float32Array(N * 2), n = pts.length / 2;
      for (let k = 0; k < N; k++) {
        const j = Math.floor(k * n / N) * 2;
        out[k * 2] = pts[j]; out[k * 2 + 1] = pts[j + 1];
      }
      return out;
    });
    // the two colour runs are sorted into these each frame; allocated once here so the
    // morph does not hand the collector two arrays per frame
    this.inkBuf = new Float32Array(N * 2);
    this.litBuf = new Float32Array(N * 2);
    const T0 = this.targets[0], n0 = T0.length / 2;
    let cx = 0, cy = 0;
    for (let k = 0; k < T0.length; k += 2) { cx += T0[k]; cy += T0[k + 1]; }
    cx /= n0; cy /= n0;
    const J = new Float32Array(N * 2);
    let sd = 20250910;
    const rnd = () => { sd = (sd * 1664525 + 1013904223) >>> 0; return sd / 4294967296; };
    for (let k = 0; k < N; k++) {
      // each dot leaves along its own radial from the sentence's centre, so the pool
      // breathes outward instead of dissolving into noise
      const ang = Math.atan2(T0[k * 2 + 1] - cy, T0[k * 2] - cx) + (rnd() - 0.5) * 0.9;
      const d = 12 + rnd() * 34;
      J[k * 2] = Math.cos(ang) * d;
      J[k * 2 + 1] = Math.sin(ang) * d * 0.7;
    }
    this.jit = J;
  }

  drawDots(tx, ty, from, to, u, vx, vy, W, H) {
    const ctx = this.dctx, T = this.targets, J = this.jit;
    if (!ctx || !T || !J) return;
    ctx.clearRect(0, 0, W, H);
    this.dotsDirty = true;
    const m = u * u * (3 - 2 * u), bulge = Math.sin(Math.PI * u);
    const A = T[from], B = T[to];
    const l = vx, r = W - vx, t = vy, b = H - vy, rad = 28;
    const ink = this.inkBuf, litp = this.litBuf;
    let ni = 0, nl = 0;
    for (let k = 0; k < A.length; k += 2) {
      const x = tx + A[k] + (B[k] - A[k]) * m + J[k] * bulge;
      const y = ty + A[k + 1] + (B[k + 1] - A[k + 1]) * m + J[k + 1] * bulge;
      // same rounded geometry the clip-path uses, so a dot switches colour exactly on the
      // box edge — the split survives the move from DOM text to canvas
      let inside = x >= l && x <= r && y >= t && y <= b;
      if (inside) {
        const dx = Math.max(l + rad - x, 0, x - (r - rad)), dy = Math.max(t + rad - y, 0, y - (b - rad));
        if (dx * dx + dy * dy > rad * rad) inside = false;
      }
      if (inside) { litp[nl] = x; litp[nl + 1] = y; nl += 2; }
      else { ink[ni] = x; ink[ni + 1] = y; ni += 2; }
    }
    const sz = 1.8;
    ctx.fillStyle = 'rgba(13,12,29,1)';
    for (let k = 0; k < ni; k += 2) ctx.fillRect(ink[k], ink[k + 1], sz, sz);
    ctx.fillStyle = 'rgba(255,255,255,1)';
    for (let k = 0; k < nl; k += 2) ctx.fillRect(litp[k], litp[k + 1], sz, sz);
  }

  renderVals() {
    return {
      stageRef: this.stage,
      boxRef: this.box,
      dotsRef: this.dots,
      litRef: this.lit
    };
  }
}
</script>
