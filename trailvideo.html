<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover">
<title>Isometric Trace Stack</title>
<script src="812f9ea7-1093-4817-9dae-64ee08718e9c"></script>
<style>
  :root{
    --panel:#f4f1ea;
    --panel-line:#dcd8ce;
    --ink:#2a2f3a;
    --sub:#8a877e;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;width:100%;overflow:hidden;}
  body{
    font:12px/1.4 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color:var(--ink);
    background:#efece6;
    display:flex;
    overflow:hidden;
    position:fixed;
    top:0;
    left:0;
    right:0;
    bottom:0;
  }
  #stage{
    position:fixed;
    top:0;
    left:0;
    right:0;
    bottom:0;
    width:100vw;
    height:100vh;
    height:100dvh;
    overflow:hidden;
  }
  #stage canvas{
    display:block;
    width:100% !important;
    height:100% !important;
  }
  #panel{
    flex:0 0 288px;
    height:100%;
    overflow-y:auto;
    background:var(--panel);
    border-left:1px solid var(--panel-line);
    padding:18px 18px 40px;
    position:relative;
    z-index:10;
  }
  #panel h1{
    font-size:11px;
    letter-spacing:.18em;
    text-transform:uppercase;
    font-weight:600;
    margin:0 0 2px;
  }
  #panel .tag{color:var(--sub);font-size:10px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:18px;}
  .group{margin:0 0 20px;}
  .group > .glabel{
    color:var(--sub);
    font-size:10px;
    letter-spacing:.16em;
    text-transform:uppercase;
    display:block;
    margin:0 0 10px;
    border-bottom:1px solid var(--panel-line);
    padding-bottom:6px;
  }
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 11px;}
  .row label{color:var(--ink);white-space:nowrap;}
  .row .val{color:var(--sub);font-variant-numeric:tabular-nums;min-width:44px;text-align:right;}
  input[type=range]{
    -webkit-appearance:none;appearance:none;
    width:100%;height:2px;background:#cfcabd;border-radius:2px;outline:none;margin:0;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;width:11px;height:11px;border-radius:50%;
    background:#2a2f3a;cursor:pointer;border:2px solid var(--panel);
  }
  input[type=range]::-moz-range-thumb{
    width:11px;height:11px;border-radius:50%;background:#2a2f3a;cursor:pointer;border:2px solid var(--panel);
  }
  .slider-wrap{width:100%;}
  .srow{display:grid;grid-template-columns:1fr;gap:4px;margin-bottom:13px;}
  .srow .top{display:flex;justify-content:space-between;}
  .srow .top label{font-size:11px;}
  .srow .top .val{color:var(--sub);font-variant-numeric:tabular-nums;}
  .seedbar{display:flex;gap:6px;align-items:stretch;margin-bottom:10px;}
  .seedbar input[type=number]{
    flex:1 1 auto;min-width:0;font:inherit;padding:6px 8px;border:1px solid var(--panel-line);
    background:#fbfaf6;color:var(--ink);border-radius:3px;text-align:center;
    font-variant-numeric:tabular-nums;-moz-appearance:textfield;
  }
  input[type=number]::-webkit-inner-spin-button{display:none;}
  button{
    font:inherit;padding:6px 9px;border:1px solid var(--panel-line);background:#fbfaf6;color:var(--ink);
    border-radius:3px;cursor:pointer;letter-spacing:.04em;transition:background .12s,border-color .12s;
  }
  button:hover{background:#fff;border-color:#c3bdae;}
  button:active{background:#eee9df;}
  .seedbar button{flex:0 0 auto;padding:6px 10px;}
  .btnrow{display:flex;gap:6px;flex-wrap:wrap;}
  .btnrow button{flex:1 1 auto;}
  .crow{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;}
  .crow label{color:var(--ink);}
  .crow input[type=color]{
    -webkit-appearance:none;appearance:none;width:34px;height:20px;padding:0;border:1px solid var(--panel-line);
    border-radius:3px;background:none;cursor:pointer;
  }
  .crow input[type=color]::-webkit-color-swatch-wrapper{padding:2px;}
  .crow input[type=color]::-webkit-color-swatch{border:none;border-radius:2px;}
  .hint{color:var(--sub);font-size:10px;margin-top:14px;line-height:1.5;}

  /* Mobile responsive */
  @media (max-width: 768px) {
    #panel {
      flex: 0 0 220px;
      padding: 12px 14px 30px;
      font-size: 11px;
    }
    #panel h1 { font-size: 10px; }
    .row { margin: 0 0 8px; gap: 6px; }
    input[type=range]::-webkit-slider-thumb {
      width: 14px;
      height: 14px;
    }
    .seedbar input[type=number] { padding: 4px 6px; font-size: 11px; }
    button { padding: 4px 8px; font-size: 11px; }
  }

  @media (max-width: 480px) {
    #panel {
      flex: 0 0 180px;
      padding: 10px 10px 20px;
      font-size: 10px;
    }
    #panel h1 { font-size: 9px; }
    .row { margin: 0 0 6px; gap: 4px; }
    .row label { font-size: 9px; }
    .row .val { min-width: 30px; font-size: 9px; }
    .group > .glabel { font-size: 8px; margin-bottom: 6px; padding-bottom: 4px; }
    .srow .top label { font-size: 9px; }
    .srow .top .val { font-size: 9px; }
    input[type=range]::-webkit-slider-thumb {
      width: 16px;
      height: 16px;
    }
    .seedbar input[type=number] { padding: 3px 4px; font-size: 10px; }
    button { padding: 3px 6px; font-size: 10px; }
    .hint { font-size: 8px; margin-top: 10px; }
  }
</style>
</head>
<body>
  
  <div id="stage"></div>

<script>
/* ---------- parameters ---------- */
const DEFAULTS = {
  depthLayers:8, tracesPerLayer:5, layerSpacing:70,
  planeWidth:520, stackHeight:360,
  jogs:3, jogDistance:34, leadIn:40, padSize:9,
  driftSpeed:0.6, rotateY:28, tiltX:34, zoom:1, depthFade:0.28
};
const SLIDER_CONF = [
  {key:'depthLayers',    label:'depth layers',   min:1,   max:24,  step:1,    rebuild:true},
  {key:'tracesPerLayer', label:'traces / layer', min:1,   max:16,  step:1,    rebuild:true},
  {key:'layerSpacing',   label:'layer spacing',  min:20,  max:200, step:1,    rebuild:true},
  {key:'planeWidth',     label:'plane width',    min:150, max:1000,step:1,    rebuild:true},
  {key:'stackHeight',    label:'stack height',   min:120, max:800, step:1,    rebuild:true},
  {key:'jogs',           label:'jogs / trace',   min:0,   max:8,   step:1,    rebuild:true},
  {key:'jogDistance',    label:'jog distance',   min:5,   max:90,  step:1,    rebuild:true},
  {key:'leadIn',         label:'lead-in',        min:5,   max:140, step:1,    rebuild:true},
  {key:'padSize',        label:'pad size',       min:2,   max:30,  step:1,    rebuild:true},
  {key:'driftSpeed',     label:'drift speed',    min:0,   max:2,   step:0.01, rebuild:false},
  {key:'rotateY',        label:'rotate Y',       min:-180,max:180, step:1,    rebuild:false},
  {key:'tiltX',          label:'tilt X',         min:0,   max:80,  step:1,    rebuild:false},
  {key:'zoom',           label:'zoom',           min:0.2, max:3,   step:0.01, rebuild:false},
  {key:'depthFade',      label:'depth fade',     min:0.02,max:0.9, step:0.01, rebuild:false},
];
const P = Object.assign({}, DEFAULTS);
let seed = 1024;
const COL = { bg:'#0d0c1d', near:'#ffffff', far:'#6f6d86', plane:'#3a3852' };

/* ---------- rng ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let rng = mulberry32(seed);

/* ---------- colour helpers ---------- */
function hex2rgb(h){h=h.replace('#','');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function lerp3(a,b,t){return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t];}
function ss(e0,e1,x){x=Math.max(0,Math.min(1,(x-e0)/(e1-e0)));return x*x*(3-2*x);}

/* ---------- geometry ---------- */
function depthSpan(){return P.depthLayers*P.layerSpacing;}

function makeRoute(laneCx, half){
  const H=P.stackHeight;
  const yTop=-H/2, yBot=H/2;
  half=Math.max(4, half);
  const lo=laneCx-half, hi=laneCx+half;
  let x=laneCx + (rng()*2-1)*half;
  const pts=[{x,y:yTop}];
  let y=yTop + P.leadIn*(0.6+rng()*0.8);
  pts.push({x,y});
  let jogs=Math.max(0,Math.round(P.jogs)+(rng()<0.5?-1:0)+(rng()<0.25?1:0));
  const remain=Math.max(1, yBot-y);
  for(let j=0;j<jogs;j++){
    let dir=rng()<0.5?-1:1;
    let nx=x+dir*P.jogDistance*(0.5+rng());
    if(nx>hi||nx<lo) nx=x-(nx-x);
    nx=Math.max(lo,Math.min(hi,nx));
    x=nx;
    pts.push({x,y});
    y+=remain*(0.35+rng()*0.5)/(jogs-j+0.5);
    if(y>yBot-4) y=yBot-4;
    pts.push({x,y});
  }
  y=yBot;
  pts.push({x,y});
  return pts;
}

let traces=[];
function rebuild(){
  rng=mulberry32(seed>>>0);
  traces=[];
  const layers=Math.max(1,Math.round(P.depthLayers));
  const lanes=Math.max(1,Math.round(P.tracesPerLayer));
  const D=depthSpan();
  const W=P.planeWidth;
  const laneW=W/lanes;
  const half=Math.max(4, laneW/2 - P.padSize - 2);
  for(let l=0;l<lanes;l++){
    const laneCx=-W/2 + laneW*(l+0.5);
    const laneSpeed=0.6 + rng()*0.7;
    for(let k=0;k<layers;k++){
      const z=-D/2 + (k+0.5)/layers*D;
      traces.push({ z, speed:laneSpeed, laneCx, laneHalf:half, route:makeRoute(laneCx, half) });
    }
  }
}

/* ---------- projection ---------- */
let cx=0, cy=0, _cry=1,_sry=0,_crx=1,_srx=0, _fit=1;
function updateTrig(){
  const ry=P.rotateY*Math.PI/180, rx=P.tiltX*Math.PI/180;
  _cry=Math.cos(ry); _sry=Math.sin(ry);
  _crx=Math.cos(rx); _srx=Math.sin(rx);
}
function updateFit(){
  const W=P.planeWidth, H=P.stackHeight, Dz=depthSpan();
  const hw=W/2, hh=H/2, hz=Dz/2;
  let maxX=0, maxY=0;
  for(const sx of [-1,1]) for(const sy of [-1,1]) for(const sz of [-1,1]){
    const x=sx*hw, y=sy*hh, z=sz*hz;
    const x1= x*_cry + z*_sry;
    const z1=-x*_sry + z*_cry;
    const y2= y*_crx - z1*_srx;
    if(Math.abs(x1)>maxX)maxX=Math.abs(x1);
    if(Math.abs(y2)>maxY)maxY=Math.abs(y2);
  }
  const margin=0.88;
  const fx=(width*margin)/(2*maxX||1), fy=(height*margin)/(2*maxY||1);
  _fit=Math.min(fx,fy);
}
function proj(x,y,z){
  const s=P.zoom*_fit;
  const x1= x*_cry + z*_sry;
  const z1=-x*_sry + z*_cry;
  const y2= y*_crx - z1*_srx;
  const z2= y*_srx + z1*_crx;
  return { x: cx + x1*s, y: cy + y2*s, d: z2 };
}

/* ---------- p5 ---------- */
let dragging=false, lastX=0, lastY=0;

function setup() {
  const st = document.getElementById('stage');
  // Force stage to fill viewport
  st.style.width = '100%';
  st.style.height = '100%';
  st.style.position = 'fixed';
  st.style.top = '0';
  st.style.left = '0';
  
  // Get actual dimensions
  let w = st.clientWidth || window.innerWidth;
  let h = st.clientHeight || window.innerHeight;
  
  // Use dvh (dynamic viewport height) fallback
  if (w === 0) w = window.innerWidth;
  if (h === 0) h = window.innerHeight;
  
  const cnv = createCanvas(w, h);
  cnv.parent('stage');
  pixelDensity(Math.min(2, window.devicePixelRatio || 1));
  rebuild();
}

function resizeCanvasToContainer() {
  const st = document.getElementById('stage');
  if (!st) return;
  
  // Force reflow
  void st.offsetHeight;
  
  const w = st.clientWidth || window.innerWidth || 1;
  const h = st.clientHeight || window.innerHeight || 1;
  
  if (w > 0 && h > 0) {
    resizeCanvas(w, h);
  }
}

function windowResized() {
  // Use requestAnimationFrame to ensure layout is complete
  if (window.requestAnimationFrame) {
    requestAnimationFrame(() => {
      resizeCanvasToContainer();
    });
  } else {
    setTimeout(resizeCanvasToContainer, 50);
  }
}

// Handle orientation changes on mobile
if (window.screen && window.screen.orientation) {
  window.screen.orientation.addEventListener('change', function() {
    setTimeout(windowResized, 400);
  });
} else {
  window.addEventListener('orientationchange', function() {
    setTimeout(windowResized, 400);
  });
}

// Resize on page load and visibility change
window.addEventListener('load', function() {
  setTimeout(windowResized, 200);
});

document.addEventListener('visibilitychange', function() {
  if (!document.hidden) {
    setTimeout(windowResized, 300);
  }
});

// Also resize on resize event (desktop)
let resizeTimer;
window.addEventListener('resize', function() {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(windowResized, 100);
});

function draw(){
  const bg=hex2rgb(COL.bg);
  background(bg[0],bg[1],bg[2]);
  cx=width/2; cy=height/2;
  updateTrig();
  updateFit();

  const D=depthSpan();
  const zFront=-D/2, zBack=D/2;
  const nearRGB=hex2rgb(COL.near), farRGB=hex2rgb(COL.far), planeRGB=hex2rgb(COL.plane);

  const dv=P.driftSpeed;
  for(const t of traces){
    t.z -= dv*t.speed;
    if(t.z<zFront){ t.z+=D; t.route=makeRoute(t.laneCx, t.laneHalf); }
  }

  const items=[];

  const W=P.planeWidth, H=P.stackHeight, hw=W/2, hz=D/2;
  for(const py of [-H/2, H/2]){
    const c=[proj(-hw,py,-hz),proj(hw,py,-hz),proj(hw,py,hz),proj(-hw,py,hz)];
    items.push({depth:(c[0].d+c[1].d+c[2].d+c[3].d)/4, kind:'plane', c});
  }

  const meta=[];
  let dMin=Infinity, dMax=-Infinity;
  for(const t of traces){
    const cd=proj(0,0,t.z).d;
    meta.push(cd);
    if(cd<dMin)dMin=cd; if(cd>dMax)dMax=cd;
  }
  const range=(dMax-dMin)||1;
  const fadeW=P.depthFade;

  for(let i=0;i<traces.length;i++){
    const t=traces[i];
    const shade=1-(meta[i]-dMin)/range;
    const col=lerp3(nearRGB,farRGB,shade);
    const weight=1.45-shade*1.0;
    const depthAlpha=1-shade*0.82;
    const u=(t.z-zFront)/D;
    const edge=ss(0,0.06,1-u)*ss(0,fadeW,u);
    const alpha=depthAlpha*edge;
    if(alpha<=0.004) continue;

    const rp=t.route.map(p=>proj(p.x,p.y,t.z));
    items.push({
      depth:meta[i], kind:'trace',
      pts:rp, col, weight, alpha,
      padTop:t.route[0], padBot:t.route[t.route.length-1], z:t.z, ps:P.padSize
    });
  }

  items.sort((a,b)=>a.depth-b.depth);

  noFill();
  for(const it of items){
    if(it.kind==='plane'){
      stroke(planeRGB[0],planeRGB[1],planeRGB[2],215);
      strokeWeight(0.9);
      beginShape();
      for(const p of it.c) vertex(p.x,p.y);
      endShape(CLOSE);
    } else {
      const a=it.alpha*255;
      stroke(it.col[0],it.col[1],it.col[2],a);
      strokeWeight(it.weight);
      beginShape();
      for(const p of it.pts) vertex(p.x,p.y);
      endShape();
      drawPad(it.padTop, it.z, it.ps, it.weight, it.col, a);
      drawPad(it.padBot, it.z, it.ps, it.weight, it.col, a);
    }
  }
}

function drawPad(p, z, s, w, col, a){
  const q=[proj(p.x-s,p.y,z-s),proj(p.x+s,p.y,z-s),proj(p.x+s,p.y,z+s),proj(p.x-s,p.y,z+s)];
  stroke(col[0],col[1],col[2],a);
  strokeWeight(w);
  beginShape();
  for(const c of q) vertex(c.x,c.y);
  endShape(CLOSE);
}

/* ---------- orbit by dragging ---------- */
function mousePressed(){
  if(mouseX>=0&&mouseX<=width&&mouseY>=0&&mouseY<=height){dragging=true;lastX=mouseX;lastY=mouseY;}
}
function mouseReleased(){dragging=false;}
function mouseDragged(){
  if(!dragging) return;
  P.rotateY += (mouseX-lastX)*0.4;
  if(P.rotateY>180)P.rotateY-=360; if(P.rotateY<-180)P.rotateY+=360;
  P.tiltX = Math.max(0,Math.min(80, P.tiltX+(mouseY-lastY)*0.35));
  lastX=mouseX; lastY=mouseY;
  syncSlider('rotateY'); syncSlider('tiltX');
}

function syncSlider(){}
</script>

</body></html>
